<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SupaRun Admin</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/core@1.2.0/dist/css/tabler.min.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.30.0/dist/tabler-icons.min.css">
<!-- 사이드바 아이콘은 FontAwesome solid — Metaplay 가 쓰는 채움형 글리프와 동형 (ADR-0008 클론 기준) -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@6.7.2/css/all.min.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.min.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700;800&display=swap">
<style>
/* ============================================================
   SupaRun Admin — Metaplay Light
   화이트 사이드바 + 회백 캔버스 + 블루 프라이머리. Metaplay
   대시보드(docs/reports/metaplay-screens) 픽셀 클론 기준.
   ============================================================ */

:root, [data-bs-theme="light"] {
  /* 컬러 */
  --page-bg:   #f4f5f7;
  --surface:   #ffffff;
  --surface-2: #f8f9fa;
  --line:      #e5e7eb;
  --line-2:    #d2d6db;
  --fg:        #212529;
  --fg-strong: #1d2939;
  --dim:       #6c757d;
  --very-dim:  #9aa3af;
  --blue:      #4a90d9;
  --blue-deep: #3479c0;
  --blue-soft: rgba(74,144,217,0.10);
  --green:     #2fb344;
  --green-soft: rgba(47,179,68,0.10);
  --amber:     #f59f00;
  --amber-soft: rgba(245,159,0,0.10);
  --orange:    #f0964b;
  --red:       #d63939;
  --red-soft:  rgba(214,57,57,0.08);

  /* Legacy alias (CSS 안에서 옛 이름 참조해도 안전) */
  --bg:            var(--page-bg);
  --bg-1:          var(--surface);
  --bg-2:          var(--surface-2);
  --bg-3:          #f2f4f7;
  --bg-primary:    var(--page-bg);
  --bg-surface:    var(--surface);
  --bg-elevated:   var(--surface);
  --bg-overlay:    rgba(29,41,57,0.45);
  --border:        var(--line);
  --border-strong: var(--line-2);
  --text-primary:  var(--fg);
  --text-secondary:var(--dim);
  --text-tertiary: var(--very-dim);
  --accent:        var(--blue);
  --accent-hover:  var(--blue-deep);
  --accent-glow:   rgba(74,144,217,0.25);
  --accent-soft:   var(--blue-soft);
  --success:       var(--green);
  --warning:       var(--amber);
  --danger:        var(--red);
  --muted:         var(--dim);

  /* 라운드·그림자 */
  --r:        10px;
  --r-sm:     6px;
  --shadow-card: 0 1px 2px rgba(16,24,40,0.04), 0 1px 3px rgba(16,24,40,0.06);
  --shadow-pop:  0 8px 24px rgba(16,24,40,0.16);
  --shadow-modal: 0 24px 48px rgba(16,24,40,0.22);

  /* Tabler/Bootstrap 변수 override */
  --tblr-bg-surface: var(--surface);
  --tblr-bg-surface-secondary: var(--surface-2);
  --tblr-body-bg: var(--page-bg);
  --tblr-body-color: var(--fg);
  --tblr-border-color: var(--line);
  --tblr-border-color-translucent: var(--line);
  --tblr-primary: var(--blue);
  --tblr-primary-rgb: 74,144,217;
  --tblr-link-color: var(--blue-deep);
  --tblr-secondary: var(--dim);
  --tblr-muted: var(--very-dim);
  --tblr-danger: var(--red);
  --tblr-success: var(--green);
  --tblr-warning: var(--amber);
  --bs-body-bg: var(--page-bg);
  --bs-body-color: var(--fg);
  --bs-border-color: var(--line);
  --bs-primary: var(--blue);
  --bs-primary-rgb: 74,144,217;
  --bs-secondary-color: var(--dim);
  --bs-tertiary-bg: var(--surface-2);
  --bs-emphasis-color: var(--fg-strong);

  /* 폰트 — 본문은 산세리프, 모노는 ID·코드·diff 전용 */
  --sans: 'Pretendard Variable','Pretendard',-apple-system,'Segoe UI',system-ui,sans-serif;
  --mono: 'JetBrains Mono','SF Mono',Consolas,monospace;
  --kr:   var(--sans);
  --font-sans: var(--sans);
  --font-mono: var(--mono);

  /* 모션 */
  --d-fast: 100ms;
  --d:      150ms;
  --ease:   ease-out;
  --duration-fast: var(--d-fast);
  --duration:      var(--d);
  --duration-slow: 260ms;
  --ease-out: ease-out;
}

/* ── 베이스 ── */
* { box-sizing: border-box; }

html { background: var(--page-bg); }
body {
  background: var(--page-bg);
  color: var(--fg);
  font-family: var(--sans);
  font-size: 14px;
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
  min-height: 100vh;
}
code, kbd, pre, samp, .text-mono, .font-mono { font-family: var(--mono); font-size: 0.92em; }
::selection { background: var(--blue); color: #fff; }

/* 스크롤바 */
::-webkit-scrollbar { width: 10px; height: 10px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--line-2); border: 3px solid transparent; border-radius: 6px; background-clip: padding-box; }
::-webkit-scrollbar-thumb:hover { background: var(--very-dim); border: 3px solid transparent; border-radius: 6px; background-clip: padding-box; }

/* ── 레이아웃 (Metaplay: 좌 고정 사이드바 + 우 헤더/캔버스) ── */
.mp-sidebar {
  position: fixed;
  top: 0; left: 0; bottom: 0;
  width: 250px;
  background: var(--surface);
  border-right: 1px solid var(--line);
  display: flex;
  flex-direction: column;
  overflow-y: auto;
  z-index: 1030;
}
.mp-main {
  margin-left: 250px;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
}
.mp-body { padding: 20px 24px 40px; }

/* ── 사이드바: 브랜드 ── */
.mp-brand {
  display: flex; align-items: center; gap: 10px;
  padding: 16px 16px 12px;
}
/* 로고 — Metaplay 의 초록 사각 "m" 모노그램 동형. 글자 하나가 곧 로고다. */
.mp-logo {
  width: 40px; height: 40px; flex: none;
  display: flex; align-items: center; justify-content: center;
  background: var(--green);
  border-radius: 8px;
  color: #fff; font-size: 22px; font-weight: 800;
  user-select: none;
}
.mp-brand-text { min-width: 0; }
.mp-brand-name {
  font-size: 17px; font-weight: 700; color: var(--fg-strong);
  line-height: 1.2;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}

/* 환경 칩 — Metaplay 의 "› demo" 자리. 로컬에선 드롭다운 전환기다. */
.tb-env { display: inline-block; }
.tb-env-chip {
  display: inline-flex; align-items: center; gap: 4px;
  background: var(--surface-2); border: 1px solid var(--line-2);
  border-radius: 6px;
  color: #495057; font-family: var(--sans); font-size: 12.5px; font-weight: 600;
  padding: 2px 10px; cursor: pointer;
}
.tb-env-chip::before { content: '›'; color: var(--very-dim); font-weight: 700; }
.tb-env-chip:hover { border-color: var(--line-2); background: #f2f4f7; color: var(--fg); }
.tb-env-chip .caret { color: var(--very-dim); font-size: 9px; }
.tb-env-backdrop { position: fixed; inset: 0; z-index: 1190; }
.tb-env-menu {
  position: fixed; min-width: 180px; z-index: 1200; /* top/left 는 칩 위치에서 인라인 계산 */
  background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-sm);
  padding: 4px; box-shadow: var(--shadow-pop);
  font-family: var(--sans); font-size: 13px;
}
.tb-env-menu button {
  display: block; width: 100%; text-align: left; background: none; border: 0;
  color: var(--fg); font: inherit;
  padding: 6px 10px; cursor: pointer; border-radius: 4px;
}
.tb-env-menu button:hover { background: var(--surface-2); color: var(--fg-strong); }
.tb-env-menu button.cur { color: var(--blue-deep); font-weight: 600; }
.tb-env-menu .sep { border-top: 1px solid var(--line); margin: 4px 0; }

/* prod 환경 — 칩·탑바가 경고색을 입는다 (Metaplay 헤더 색 구분 동형, #20) */
.env-prod .tb-env-chip, .tb-env-chip.env-prod {
  background: var(--red-soft); border-color: rgba(214,57,57,0.35); color: var(--red);
}

/* ── 사이드바: 내비게이션 ── */
.mp-nav { flex: 1; padding-bottom: 8px; }
.tree-section {
  font-family: var(--sans);
  font-size: 14px; font-weight: 700; color: var(--fg-strong);
  padding: 16px 16px 6px;
}
.tree-list { display: flex; flex-direction: column; }
.tree-item {
  display: flex; align-items: center; gap: 12px;
  padding: 10px 16px; color: #344054;
  font-family: var(--sans); font-size: 15px;
  cursor: pointer; text-decoration: none;
  transition: background var(--d-fast) var(--ease), color var(--d-fast) var(--ease);
}
/* 아이콘은 FA solid(채움형) — Metaplay 글리프 동형. 폭을 고정해 라벨 시작선을 맞춘다. */
.tree-item i { font-size: 14px; width: 20px; text-align: center; color: #40484f; flex: none; }
.tree-item:hover { color: var(--fg-strong); background: var(--surface-2); }
.tree-item.active { background: var(--blue); color: #fff; }
.tree-item.active i { color: #fff; }
.tree-item.active:hover { background: var(--blue); color: #fff; }
/* 자리만 있는 항목 (LiveOps not enabled, log out) — 클릭 불가, 흐리게 */
.tree-item.muted { opacity: 0.5; cursor: default; pointer-events: none; }
.tree-item .label { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tree-item .num { margin-left: auto; color: var(--very-dim); font-size: 11px; padding-left: 6px; }

/* Config 하위 그룹 (PERKS·TABLES 등) — Metaplay 에 없는 우리 고유 계층.
   그룹 머리는 작은 대문자 라벨, 항목은 살짝 들여쓴다. */
.tree-section.toggle {
  display: flex; align-items: center; gap: 6px; width: 100%;
  background: none; border: none; text-align: left; cursor: pointer;
  font-family: var(--sans); font-size: 11px; font-weight: 700;
  letter-spacing: 0.08em; text-transform: uppercase; color: var(--very-dim);
  padding: 12px 16px 4px;
}
.tree-section.toggle:hover { color: var(--dim); }
.tree-section .caret { font-size: 9px; width: 10px; color: var(--very-dim); }
.tree-count { margin-left: auto; color: var(--very-dim); font-size: 10px; font-weight: 600; }
.tree-loading {
  display: flex; align-items: center; gap: 8px;
  padding: 10px 16px;
  font-size: 12px; color: var(--dim);
}

/* Log Out — Metaplay 처럼 구분선으로 분리된 하단 그룹 */
.mp-logout { margin-top: 14px; padding-top: 8px; border-top: 1px solid var(--line); }

/* 사이드바 하단 상태 — Metaplay 워터마크 자리. 접속 정보만 작게 남긴다. */
.sidebar-status {
  margin-top: auto; padding: 12px 16px;
  border-top: 1px solid var(--line);
  font-size: 11px; color: var(--very-dim); line-height: 1.7;
}
.sidebar-status .ok { color: var(--green); }
.sidebar-status .lbl { color: var(--very-dim); margin-right: 6px; }
/* Bootstrap .row 의 음수 마진·자식 width:100% 를 무력화한다 — 여기서는 그냥 한 줄이다 */
.sidebar-status .row { display: flex; flex-wrap: nowrap; gap: 6px; align-items: baseline; margin: 0; }
.sidebar-status .row > * { width: auto; padding: 0; }

/* ── 탑바 (Metaplay: 페이지 타이틀 + 듀얼 시계 + 아바타) ── */
.mp-topbar {
  position: sticky; top: 0; z-index: 1020;
  display: flex; align-items: center; gap: 12px;
  height: 52px; padding: 0 24px;
  background: var(--surface);
  border-bottom: 1px solid var(--line);
}
.mp-topbar-title {
  font-size: 17px; font-weight: 700; color: var(--fg-strong);
  margin: 0;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.mp-topbar .spacer { flex: 1; }
.mp-topbar.env-prod { box-shadow: inset 0 3px 0 var(--red); }
.mp-topbar.env-prod .mp-topbar-title { color: var(--red); }
/* 아바타 — Metaplay 동형: 회색 원 + 사람 글리프 */
.mp-avatar {
  width: 34px; height: 34px; flex: none;
  display: flex; align-items: center; justify-content: center;
  border-radius: 50%;
  background: #e4e7ec; color: #556270;
  font-size: 15px;
  user-select: none;
}
/* 듀얼 시계 — Metaplay 동형: UTC 가 위, 로컬이 아래로 쌓인 2단. 라벨 열이 맞아야 스캔이 된다. */
.tb-clock {
  display: flex; flex-direction: column; align-items: flex-end;
  font-size: 12px; line-height: 1.35; white-space: nowrap;
}
.tb-clock-row { display: flex; align-items: baseline; gap: 8px; }
.tb-clock .tz { color: var(--very-dim); font-size: 11px; font-weight: 600; }
.tb-clock .t { color: #495057; font-variant-numeric: tabular-nums; }

/* ── 페이지 툴바 (구 page-header — 부제·검색·액션) ── */
.page-wrapper, .page, .container, .container-xl, .container-fluid { background: transparent; }
.page-wrapper { padding: 0; }
.page-header {
  padding: 0 0 14px;
  margin: 0;
  background: transparent;
  border: 0;
}
.page-title {
  font-size: 16px; font-weight: 700; color: var(--fg-strong);
  margin: 0;
}

/* ── 카드 ── */
.card {
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: var(--r);
  box-shadow: var(--shadow-card);
  color: var(--fg);
}
.card-header {
  background: transparent;
  border-bottom: 1px solid var(--line);
  padding: 14px 16px;
  border-radius: var(--r) var(--r) 0 0;
}
.card-title {
  font-size: 15px; font-weight: 700; color: var(--fg-strong);
  margin: 0;
}
.card-body { padding: 16px; }
.card-footer { background: transparent; border-top: 1px solid var(--line); border-radius: 0 0 var(--r) var(--r); }

/* ── 테이블 ── */
.table {
  background: transparent;
  color: var(--fg);
  font-size: 13px;
  margin: 0;
  --bs-table-bg: transparent;
  --bs-table-color: var(--fg);
  --bs-table-border-color: var(--line);
  --bs-table-striped-bg: var(--surface-2);
  --bs-table-striped-color: var(--fg);
}
.table > :not(caption) > * > * {
  background: transparent;
  color: var(--fg);
  border-bottom-color: var(--line);
}
.table thead th {
  background: var(--surface);
  border-bottom: 2px solid var(--line);
  border-top: none;
  font-size: 12.5px;
  font-weight: 700;
  color: var(--fg-strong);
  padding: 10px 12px;
  white-space: nowrap;
  position: sticky;
  top: 0;
  z-index: 10;
}
/* ── 메인 Config 시트: 컨테이너에 viewport-fit 높이 부여 → 가로 스크롤바 항상 노출 + thead sticky 정상 작동 ── */
#table-container {
  max-height: calc(100vh - 190px);
  overflow: auto;
}
.table tbody td {
  padding: 8px 12px;
  height: 34px;
  vertical-align: middle;
  color: var(--fg);
  border-bottom: 1px solid var(--line);
}
/* 홀수 행 스트라이프 — Metaplay 목록 동형. 편집 상태(hover·저장 플래시)보다 옅게 깐다. */
.card .table > tbody > tr:nth-child(odd) > * { background: var(--surface-2); }
.table-hover > tbody > tr {
  transition: background var(--d-fast) var(--ease);
  --bs-table-hover-bg: transparent;
}
.table-hover > tbody > tr:hover > * { background: #f2f6fc; }
.cell-edit {
  cursor: pointer;
  min-height: 1.5em;
  padding: 2px 6px;
  border-radius: 4px;
  transition: background var(--d-fast) var(--ease);
}
.cell-edit:hover { background: var(--blue-soft); }
.cell-saved { animation: cellSaved 1s var(--ease); }
@keyframes cellSaved {
  0%   { background: var(--green-soft); box-shadow: inset 0 0 0 1px var(--green); }
  100% { background: transparent; box-shadow: none; }
}
.cell-input {
  width: 100%;
  background: var(--surface);
  border: 1px solid var(--blue);
  border-radius: 4px;
  padding: 2px 6px;
  outline: none;
  color: var(--fg);
  font-size: 13px;
  transition: box-shadow var(--d) var(--ease);
}
.cell-input:focus { box-shadow: 0 0 0 3px var(--accent-glow); }
.cell-na {
  display: block;
  text-align: center;
  color: var(--very-dim);
  background: transparent;
  padding: 2px 0;
  cursor: not-allowed;
  user-select: none;
  font-size: 11px;
}
.row-highlight { animation: rowHighlight 1s var(--ease); }
@keyframes rowHighlight {
  0%   { background: var(--blue-soft); box-shadow: inset 3px 0 0 var(--blue); }
  100% { background: transparent; box-shadow: none; }
}
.row-enter { animation: rowEnter 0.25s var(--ease) both; }
@keyframes rowEnter {
  from { opacity: 0; transform: translateY(-4px); }
  to   { opacity: 1; transform: translateY(0); }
}
tbody tr { animation: rowStagger 0.2s var(--ease) both; }
@keyframes rowStagger { from { opacity: 0; } to { opacity: 1; } }
.row-delete { animation: rowDelete 0.25s var(--ease) forwards; }
@keyframes rowDelete {
  to { opacity: 0; transform: translateX(20px); max-height: 0; padding: 0; overflow: hidden; }
}
.th-resize {
  position: absolute;
  right: 0; top: 0; bottom: 0;
  width: 5px;
  cursor: col-resize;
  user-select: none;
  z-index: 2;
}
.th-resize:hover, .th-resize.active { background: var(--blue); opacity: 0.5; }
.col-resizing { cursor: col-resize !important; user-select: none !important; }

/* PK/ID 컬럼 (첫 컬럼) — 모노 + 블루. Metaplay 의 Player:XXXX 표기 동형 */
.table tbody td:first-child {
  font-family: var(--mono);
  font-size: 12px;
  color: var(--blue-deep);
}

/* ── 폼 ── */
.form-control, .form-select {
  background: var(--surface);
  border: 1px solid var(--line-2);
  color: var(--fg);
  border-radius: var(--r-sm);
  font-size: 13px;
  padding: 6px 10px;
  height: 32px;
  transition: border-color var(--d) var(--ease), box-shadow var(--d) var(--ease);
}
.form-control:focus, .form-select:focus {
  background: var(--surface);
  border-color: var(--blue);
  box-shadow: 0 0 0 3px var(--accent-glow);
  color: var(--fg);
  outline: none;
}
.form-control::placeholder { color: var(--very-dim); }
.form-control-sm, .form-select-sm { font-size: 12px; padding: 4px 8px; height: 28px; }
.form-label {
  font-size: 12px; font-weight: 600;
  color: var(--dim);
  margin-bottom: 4px;
}
.input-group-text {
  background: var(--surface-2);
  border-color: var(--line-2);
  color: var(--dim);
  border-radius: var(--r-sm);
}
.input-icon-addon { color: var(--very-dim); }
.form-check-input {
  background-color: var(--surface);
  border: 1px solid var(--line-2);
  border-radius: 4px;
}
.form-check-input:checked {
  background-color: var(--blue);
  border-color: var(--blue);
}
.form-check-input:focus {
  border-color: var(--blue);
  box-shadow: 0 0 0 3px var(--accent-glow);
}
.form-switch .form-check-input { border-radius: 2em; }

/* ── 버튼 ── */
.btn {
  background: var(--surface);
  border: 1px solid var(--line-2);
  color: #344054;
  font-family: var(--sans);
  font-size: 13px;
  font-weight: 600;
  border-radius: var(--r-sm);
  padding: 6px 14px;
  height: 32px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  transition: background var(--d) var(--ease), border-color var(--d) var(--ease), color var(--d) var(--ease);
}
.btn:hover { background: var(--surface-2); border-color: var(--very-dim); color: var(--fg-strong); }
.btn-sm { font-size: 12px; padding: 4px 10px; height: 28px; }
.btn-primary {
  background: var(--blue);
  border-color: var(--blue);
  color: #fff;
}
.btn-primary:hover {
  background: var(--blue-deep);
  border-color: var(--blue-deep);
  color: #fff;
}
.btn-primary:active { background: var(--blue-deep); }
.btn-outline-primary {
  background: transparent;
  border-color: var(--blue);
  color: var(--blue-deep);
}
.btn-outline-primary:hover {
  background: var(--blue);
  border-color: var(--blue);
  color: #fff;
}
.btn-outline-secondary {
  background: var(--surface);
  border-color: var(--line-2);
  color: #344054;
}
.btn-outline-secondary:hover {
  background: var(--surface-2);
  border-color: var(--very-dim);
  color: var(--fg-strong);
}
.btn-secondary, .btn-light {
  background: var(--surface-2);
  border-color: var(--line-2);
  color: #344054;
}
.btn-secondary:hover, .btn-light:hover {
  background: #eceef1;
  border-color: var(--very-dim);
  color: var(--fg-strong);
}
.btn-danger {
  background: var(--red);
  border-color: var(--red);
  color: #fff;
}
.btn-danger:hover {
  background: #b52a2a;
  border-color: #b52a2a;
  color: #fff;
}
.btn-outline-danger {
  background: transparent;
  border-color: rgba(214,57,57,0.5);
  color: var(--red);
}
.btn-outline-danger:hover {
  background: var(--red);
  border-color: var(--red);
  color: #fff;
}
.btn-ghost-primary,
.btn-ghost-secondary {
  background: transparent;
  border-color: transparent;
  color: var(--blue-deep);
}
.btn-ghost-primary:hover,
.btn-ghost-secondary:hover {
  background: var(--blue-soft);
  border-color: transparent;
  color: var(--blue-deep);
}
.btn-ghost-danger {
  background: transparent;
  border-color: transparent;
  color: var(--red);
}
.btn-ghost-danger:hover {
  background: var(--red-soft);
  border-color: transparent;
  color: var(--red);
}
.btn-ghost-success { background: transparent; border-color: transparent; color: var(--green); }
.btn-ghost-success:hover { background: var(--green-soft); border-color: transparent; color: var(--green); }
.btn-ghost-warning { background: transparent; border-color: transparent; color: var(--amber); }
.btn-ghost-warning:hover { background: var(--amber-soft); border-color: transparent; color: var(--amber); }
.btn-ghost-light { background: transparent; border-color: transparent; color: var(--dim); }
.btn-ghost-light:hover { background: var(--surface-2); border-color: transparent; color: var(--fg); }
.btn-icon { width: 32px; padding: 0; }
.btn-sm.btn-icon { width: 28px; }
.btn:focus-visible {
  outline: none;
  box-shadow: 0 0 0 3px var(--accent-glow);
}
.btn-close { border-radius: 4px; opacity: 0.6; transition: opacity var(--d) var(--ease); }
.btn-close:hover { opacity: 1; }
.btn-list { gap: 6px; }

/* ── 모달 ── */
.modal-backdrop { background: var(--bg-overlay); }
.modal-backdrop.show { opacity: 1; }
.modal-content {
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: var(--r);
  box-shadow: var(--shadow-modal);
  color: var(--fg);
}
.modal-header {
  border-bottom: 1px solid var(--line);
  padding: 14px 18px;
  background: var(--surface);
  border-radius: var(--r) var(--r) 0 0;
}
.modal-title {
  font-size: 15px; font-weight: 700; color: var(--fg-strong);
  margin: 0;
  display: flex; align-items: center; gap: 8px;
}
.modal-body { padding: 16px 18px; background: transparent; }
.modal-footer {
  border-top: 1px solid var(--line);
  padding: 12px 18px;
  background: transparent;
  gap: 8px;
  border-radius: 0 0 var(--r) var(--r);
}
.modal-xl, .modal-lg { max-width: min(1280px, calc(100vw - 32px)); }
.modal.fade .modal-dialog {
  transform: translate3d(0,-8px,0);
  transition: transform 150ms ease-out, opacity 150ms ease-out;
}
.modal.show .modal-dialog { transform: none; }

/* ── JSON 매트릭스 모달 (핵심 영역) ── */
#json-editor-modal .modal-dialog { max-width: min(1280px, calc(100vw - 32px)); }
#json-editor-rows {
  max-height: calc(100vh - 240px);
  overflow: auto;
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: var(--r-sm);
}
#json-editor-rows table { table-layout: fixed; margin: 0; background: transparent; }
#json-editor-rows th {
  font-size: 12px;
  font-weight: 700;
  color: var(--fg-strong);
  background: var(--surface-2);
  border-bottom: 1px solid var(--line);
  padding: 8px 10px;
  position: sticky;
  top: 0;
  z-index: 1;
}
#json-editor-rows td {
  padding: 6px 8px;
  border-bottom: 1px solid var(--line);
  vertical-align: middle;
  background: transparent;
  font-size: 12px;
}
#json-editor-rows tr:last-child td { border-bottom: none; }
#json-editor-rows tr:hover { background: #f2f6fc; }
#json-editor-rows input[type="text"],
#json-editor-rows input[type="number"] {
  min-width: 60px;
  background: transparent;
  border: 1px solid transparent;
  font-size: 12px;
  padding: 4px 8px;
  height: 26px;
  border-radius: 4px;
  color: var(--fg);
  transition: background var(--d-fast) var(--ease), border-color var(--d-fast) var(--ease), box-shadow var(--d-fast) var(--ease);
}
#json-editor-rows input:hover { background: var(--surface-2); }
#json-editor-rows input:focus {
  background: var(--surface);
  border-color: var(--blue);
  box-shadow: 0 0 0 2px var(--accent-glow);
  outline: none;
}
#json-editor-rows select {
  background: transparent;
  border: 1px solid var(--line);
  font-size: 12px;
  padding: 4px 8px;
  height: 26px;
  border-radius: 4px;
  color: var(--fg);
}
#json-editor-rows select:focus {
  background: var(--surface);
  border-color: var(--blue);
  box-shadow: 0 0 0 2px var(--accent-glow);
  outline: none;
}
#json-editor-breadcrumb {
  font-family: var(--mono);
  font-size: 12px;
  color: var(--blue-deep);
}
#json-editor-back {
  background: var(--surface);
  border: 1px solid var(--line-2);
  color: #344054;
  font-size: 12px;
  font-weight: 600;
  padding: 4px 10px;
  height: 26px;
  border-radius: var(--r-sm);
  transition: all var(--d) var(--ease);
}
#json-editor-back:hover {
  background: var(--surface-2);
  color: var(--fg-strong);
  border-color: var(--very-dim);
}

/* ── 배지 (Metaplay: 짙은 회색 필 "MySql"·"Off" 동형) ── */
.badge {
  font-family: var(--sans);
  font-size: 11px;
  font-weight: 600;
  padding: 3px 8px;
  border-radius: 4px;
  border: 1px solid transparent;
  transition: all var(--d-fast) var(--ease);
}
.badge.bg-cyan-lt, .badge.bg-blue-lt, .json-badge {
  background: var(--blue-soft) !important;
  color: var(--blue-deep) !important;
  border-color: rgba(74,144,217,0.25);
  cursor: pointer;
  display: inline-flex;
  align-items: center;
  gap: 4px;
  max-width: 220px;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.badge.bg-cyan-lt:hover, .badge.bg-blue-lt:hover, .json-badge:hover {
  background: var(--blue) !important;
  color: #fff !important;
  border-color: var(--blue);
}
.badge.bg-green { background: var(--green) !important; color: #fff !important; border-color: var(--green); }
.badge.bg-red, .badge.bg-danger { background: var(--red) !important; color: #fff !important; border-color: var(--red); }
.badge.bg-yellow, .badge.bg-orange { background: var(--orange) !important; color: #fff !important; border-color: var(--orange); }
.badge.bg-purple, .badge.bg-pink, .badge.bg-teal, .badge.bg-cyan, .badge.bg-blue {
  background: var(--blue-soft) !important; color: var(--blue-deep) !important; border-color: rgba(74,144,217,0.25);
}
.badge.bg-secondary { background: #6c757d !important; color: #fff !important; border-color: #6c757d; }
.stat-badge {
  font-size: 11px;
  padding: 3px 8px;
  border-radius: 4px;
  font-weight: 600;
}

/* ── 토스트 ── */
.toast-container {
  position: fixed;
  bottom: 20px;
  right: 20px;
  z-index: 9999;
  display: flex;
  flex-direction: column-reverse;
  gap: 8px;
}
.toast-item {
  padding: 10px 14px;
  border-radius: var(--r-sm);
  color: var(--fg);
  font-size: 13px;
  background: var(--surface);
  border: 1px solid var(--line);
  box-shadow: var(--shadow-pop);
  display: flex;
  align-items: center;
  gap: 8px;
  animation: toastIn 0.2s var(--ease), toastOut 0.2s var(--ease) 2.5s forwards;
}
.toast-item.success { border-left: 3px solid var(--green); }
.toast-item.error { border-left: 3px solid var(--red); }
.toast-item.info { border-left: 3px solid var(--blue); }
@keyframes toastIn  { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
@keyframes toastOut { to   { opacity: 0; transform: translateY(-4px); } }

/* ── Empty / Loading ── */
.empty-state {
  padding: 4rem 2rem; text-align: center;
  color: var(--dim);
}
.empty-state i { font-size: 2.5rem; margin-bottom: 1rem; opacity: 0.5; color: var(--very-dim); }
.empty-state h3 {
  font-size: 15px; font-weight: 700;
  color: var(--fg-strong); margin: 0 0 8px;
}
.empty-state p { font-size: 13px; color: var(--dim); }
.loading-spinner { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; padding: 3rem; }
.spinner-border { border-color: var(--line); border-top-color: var(--blue); border-radius: 50%; }

/* 원호 스피너 — conic-gradient 링. 끝으로 갈수록 진해져 회전 방향이 읽힌다. */
.sr-spinner {
  --sr-size: 32px;
  --sr-thick: 3px;
  display: inline-block;
  flex: none;
  width: var(--sr-size);
  height: var(--sr-size);
  border-radius: 50%;
  background: conic-gradient(from 0deg,
    rgba(74,144,217,0)    0deg,
    rgba(74,144,217,0.15) 100deg,
    var(--blue)           280deg,
    var(--blue-deep)      335deg,
    #2b62a3               357deg,
    rgba(74,144,217,0)    360deg);
  -webkit-mask: radial-gradient(farthest-side, transparent calc(100% - var(--sr-thick)), #000 calc(100% - var(--sr-thick)));
          mask: radial-gradient(farthest-side, transparent calc(100% - var(--sr-thick)), #000 calc(100% - var(--sr-thick)));
  animation: srSpin 0.85s linear infinite;
}
@keyframes srSpin { to { transform: rotate(360deg); } }

/* 로딩 문구 — 스피너만 있으면 무엇을 기다리는지 알 수 없다. */
.sr-label {
  font-size: 12px;
  color: var(--dim);
  animation: spinnerPulse 1.4s ease-in-out infinite;
}

/* 아직 그릴 화면 자체가 없을 때(첫 진입) 덮는 로더. */
.sr-fullscreen {
  position: fixed;
  inset: 0;
  z-index: 2000;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 14px;
  background: var(--page-bg);
}

/* 버튼 안에 들어가는 스피너 — 라벨과 같은 줄에 세로 중앙으로 놓는다. */
.oauth-btn .sr-spinner { vertical-align: -2px; margin-right: 6px; }
.oauth-btn:disabled { opacity: 0.5; pointer-events: none; }

/* ── 환경 현황판 ─────────────────────────────────────
   카드 하나 = 환경 하나. 왼쪽은 신원(무엇인가), 오른쪽은 지표(지금 어떤가). */
.env-list { display: flex; flex-direction: column; gap: 14px; padding: 16px; }

.env-card {
  display: grid;
  grid-template-columns: minmax(220px, 300px) 1fr;
  border: 1px solid var(--line);
  border-radius: var(--r);
  background: var(--surface);
  box-shadow: var(--shadow-card);
  overflow: hidden;
}
/* 좁은 화면에서는 위아래로 쌓는다 — 지표가 잘리면 볼 이유가 없다 */
@media (max-width: 720px) {
  .env-card { grid-template-columns: 1fr; }
  .env-card-side { border-right: none !important; border-bottom: 1px solid var(--line); }
}

.env-card-side { padding: 16px; border-right: 1px solid var(--line); }
.env-card-main { padding: 16px; display: flex; flex-direction: column; gap: 12px; }

.env-card-title { display: flex; align-items: center; gap: 8px; }
.env-name { font-size: 16px; font-weight: 700; color: var(--fg-strong); }

.env-dot { width: 9px; height: 9px; border-radius: 50%; flex: none; }
.env-dot.ok     { background: var(--green); }
.env-dot.paused { background: var(--very-dim); }
.env-dot.down   { background: var(--red); }

.env-badges { display: flex; flex-wrap: wrap; gap: 6px; margin: 10px 0 14px; }
.env-badge {
  font-size: 11px; font-weight: 600;
  padding: 2px 8px; border-radius: 999px;
  border: 1px solid transparent;
}
.env-badge.ok       { color: var(--green); background: var(--green-soft); }
.env-badge.paused   { color: var(--dim); background: var(--surface-2); border-color: var(--line); }
.env-badge.down     { color: var(--red); background: var(--red-soft); }
.env-badge.starting { color: var(--amber); background: var(--amber-soft); }
/* 어느 환경이 에디터·빌드 대상인지가 사고를 막는 정보다 — 눈에 띄게 둔다 */
.env-badge.editor { color: #b57700; background: var(--amber-soft); }
.env-badge.build  { color: var(--blue-deep); background: var(--blue-soft); }
/* 지금 보고 있는 어드민이 붙은 곳 — 다른 환경과 헷갈리지 않게 채워서 표시한다 */
.env-badge.here   { color: #fff; background: var(--blue); }

.env-meta {
  display: grid; grid-template-columns: 56px 1fr;
  gap: 4px 10px; margin: 0;
  font-size: 12px;
}
.env-meta dt { color: var(--dim); font-weight: 400; }
.env-meta dd { margin: 0; color: var(--fg); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-family: var(--mono); font-size: 11px; }
.env-domain a { color: var(--blue-deep); text-decoration: none; }
.env-domain a:hover { text-decoration: underline; }

.env-metrics { display: grid; grid-template-columns: repeat(auto-fit, minmax(110px, 1fr)); gap: 16px; }
.env-metric-label { font-size: 12px; color: var(--dim); }
.env-metric-value { font-size: 22px; font-weight: 700; margin-top: 2px; color: var(--fg-strong); }
.env-metric-value.ok     { color: var(--fg-strong); }
.env-metric-value.warn   { color: var(--amber); }
.env-metric-value.danger { color: var(--red); }
.env-metric-value.none   { color: var(--very-dim); }
.env-metric-sub { font-size: 11px; color: var(--very-dim); margin-top: 2px; }

.env-services { display: flex; flex-wrap: wrap; gap: 12px; font-size: 12px; }
.env-service.ok   { color: var(--green); }
.env-service.down { color: var(--red); }

.env-error {
  font-size: 12px; color: var(--red);
  border-left: 2px solid var(--red); padding-left: 8px;
}

.env-collected { margin-top: auto; font-size: 11px; color: var(--very-dim); }

.env-actions { display: flex; align-items: center; gap: 10px; }
.env-actions-hint { font-size: 11px; color: var(--very-dim); }

/* 환경 선택 화면 머리말 */
.env-intro {
  padding: 4px 2px 8px;
  display: flex; align-items: flex-start; justify-content: space-between; gap: 12px;
}
.env-heading { font-size: 18px; font-weight: 700; color: var(--fg-strong); margin: 0; }
.env-subheading { font-size: 12px; color: var(--dim); margin: 4px 0 0; }

/* 카드 전체가 진입점이다 — 되돌릴 수 없는 조작은 설정에만 둔다 */
.env-card.clickable { cursor: pointer; transition: border-color var(--d) var(--ease), box-shadow var(--d) var(--ease); }
.env-card.clickable:hover { border-color: var(--blue); box-shadow: 0 2px 8px rgba(74,144,217,0.15); }
.env-card.clickable:focus-visible { outline: 2px solid var(--blue); outline-offset: 2px; }
.env-enter-hint { font-size: 12px; color: var(--blue-deep); }

/* 환경에 안 붙은 프로젝트 — 지표 대신 다음 할 일을 적는다 */
.env-unlinked { font-size: 12px; color: var(--dim); line-height: 1.7; }
.env-ref { font-family: var(--mono); font-size: 10px; color: var(--very-dim); }

/* ── 앱 설정 ── */
.appset { display: flex; flex-direction: column; gap: 20px; padding: 16px; }
.appset-block { border: 1px solid var(--line); border-radius: var(--r); background: var(--surface); padding: 16px; }
.appset-block.danger { border-color: rgba(214,57,57,0.4); }
.appset-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; }
.appset-title { font-size: 14px; font-weight: 700; color: var(--fg-strong); margin: 0 0 4px; }
.appset-title.danger { color: var(--red); }
.appset-desc { font-size: 12px; color: var(--dim); margin: 0 0 10px; line-height: 1.7; }
.appset-status { font-size: 12px; color: var(--dim); display: flex; align-items: center; gap: 8px; }
.appset-status.on  { color: var(--green); }
.appset-status.off { color: var(--dim); }
.appset-empty { font-size: 12px; color: var(--very-dim); padding: 12px 0; }
.appset-danger-row {
  display: flex; align-items: center; justify-content: space-between; gap: 12px;
  padding: 10px 0; border-top: 1px solid var(--line);
}
.appset-danger-name { font-size: 13px; color: var(--fg); }

/* 설정 한 줄 — 왼쪽은 무엇인가, 오른쪽은 입력. */
.appset-row {
  /* wrap — 펼친 입력 영역(.appset-edit)이 줄 아래로 내려가야 한다 */
  display: flex; align-items: center; justify-content: space-between; gap: 16px; flex-wrap: wrap;
  padding: 12px 0; border-top: 1px solid var(--line);
}
.appset-row-main { min-width: 0; }
.appset-row-name { font-size: 13px; color: var(--fg); font-weight: 600; display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
/* 행 설명 — 산세리프 한 줄. 모노는 실제 키·코드 값에만 쓴다(한글 모노는 소음이다). */
.appset-row-key { font-size: 12px; color: var(--dim); }

/* 상태 칩 — "비어 있음"·"설정됨" 같은 상태 줄을 텍스트 대신 칩 하나로 접는다.
   시각·수정자 등 세부는 title 툴팁이 말한다. */
.stat-chip {
  display: inline-flex; align-items: center;
  font-size: 11px; font-weight: 600; line-height: 1;
  padding: 3px 8px; border-radius: 999px;
  cursor: default;
}
.stat-chip.on  { background: var(--green-soft); color: #1e7e34; }
.stat-chip.off { background: var(--surface-2); color: var(--very-dim); border: 1px solid var(--line); }

/* ⓘ — 산문 설명을 접어 두는 자리. title 툴팁으로 세부를 말한다. */
.hint-i { color: var(--very-dim); font-size: 13px; cursor: help; }
.hint-i:hover { color: var(--dim); }

/* 카드 안 섹션 제목 — Metaplay 카드 문법(제목 + 필요하면 ⓘ, 산문 없음) */
.sec-title { font-size: 16px; font-weight: 700; color: var(--fg-strong); margin: 2px 0 10px; }

/* 카드 하단 각주 — 산문 카드 하나를 차지하던 정책 설명이 접힌 자리 */
.appset-foot {
  margin: 14px 0 0; padding-top: 10px;
  border-top: 1px solid var(--line);
  font-size: 12px; color: var(--very-dim);
}
.appset-row-fields { display: flex; align-items: center; gap: 12px; flex: none; }
.appset-row-fields .form-control { width: 200px; }
.appset-row-fields .form-select { width: 200px; }

/* 프로바이더 한 줄을 펼쳤을 때의 입력 영역. 줄 전체 폭을 쓰도록 flex 흐름에서 빠진다 */
.appset-edit { flex-basis: 100%; padding: 12px 0 4px; }
.appset-label {
  display: block; margin: 10px 0 4px;
  font-size: 12px; color: var(--dim);
}
.appset-edit .form-control { width: 100%; max-width: 460px; }

/* ── Google OAuth 안내 ──
   전체 흐름에서 유일하게 자동화가 안 되는 구간이라, 손으로 옮길 값을 눈에 띄게 둔다 */
.gsetup { margin: 4px 0 14px; padding: 12px 14px; border: 1px solid var(--line); border-radius: var(--r-sm); background: var(--surface-2); }
.gsetup-steps {
  margin: 0; padding-left: 18px;
  font-size: 12px; color: var(--dim); line-height: 1.9;
}
.gsetup-steps li { margin-bottom: 10px; }
/* 먼저 알아야 손해를 안 보는 것 — 단계 위에 따로 세운다 */
.gsetup-pre {
  margin-bottom: 10px; padding: 8px 10px;
  border-left: 3px solid var(--blue); background: var(--blue-soft); border-radius: 0 4px 4px 0;
  font-size: 12px; color: var(--fg); line-height: 1.7;
}
.gsetup-steps b { color: var(--fg-strong); }
.gsetup-steps code { color: var(--blue-deep); }
.gsetup-actions { margin: 6px 0 2px; }
/* 메뉴 경로·키 이름 — 콘솔에서 어디를 눌러야 하는지 */
.gsetup-where {
  margin: 4px 0 2px; padding-left: 8px; border-left: 1px solid var(--line);
  font-size: 11px; color: var(--very-dim); line-height: 1.8;
}
.gsetup-where b { color: var(--blue-deep); }

.gsetup-copy { margin: 8px 0 2px; }
.gsetup-copy-label { font-size: 11px; color: var(--very-dim); margin-bottom: 3px; }
.gsetup-copy-hint { color: var(--very-dim); }
.gsetup-copy-row { display: flex; align-items: center; gap: 8px; }
/* 값이 길어 줄바꿈되면 붙여넣을 때 오타가 난다 — 한 줄로 두고 넘치면 스크롤 */
.gsetup-copy-value {
  flex: 1; min-width: 0; overflow-x: auto; white-space: nowrap;
  padding: 5px 8px; border: 1px solid var(--line); border-radius: 4px; background: var(--surface);
  font-family: var(--mono); font-size: 11px; color: var(--blue-deep);
}

.gsetup-warn {
  margin-top: 8px; padding: 8px 10px;
  border-left: 3px solid var(--amber); background: var(--amber-soft); border-radius: 0 4px 4px 0;
  font-size: 12px; color: var(--fg); line-height: 1.7;
}

/* ⚡ 문구 — 이 값이 실제로 무엇을 켜는지. 설정 화면에서 가장 값어치 있는 정보다 */
.appset-note {
  margin-top: 12px; padding: 10px 12px;
  border-left: 3px solid var(--amber); background: var(--amber-soft); border-radius: 0 4px 4px 0;
  font-size: 12px; color: var(--fg); line-height: 1.8;
}
.appset-actions { display: flex; align-items: center; gap: 12px; margin-top: 14px; }
.appset-dirty { font-size: 12px; color: var(--amber); }

/* ── 대시보드 (Metaplay Overview 동형 — 경고 배너 + 지표 타일 + 최근 변경) ── */
.dash { display: flex; flex-direction: column; gap: 16px; padding: 16px; }

/* 쓰기가 열린 테이블 — 들어오자마자 보여야 하는 유일한 경고다 */
.dash-alert {
  display: flex; gap: 6px; padding: 12px 14px;
  border: 1px solid rgba(214,57,57,0.3); border-radius: var(--r-sm);
  background: #fceeee;
  font-size: 13px; color: #a12622;
}
.dash-alert-sub { font-size: 12px; color: var(--fg); margin-top: 6px; line-height: 1.7; }

.dash-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 12px; }
.dash-tile { border: 1px solid var(--line); border-radius: var(--r); background: var(--surface); box-shadow: var(--shadow-card); padding: 14px 16px; }
.dash-tile.clickable { cursor: pointer; transition: border-color var(--d) var(--ease), box-shadow var(--d) var(--ease); }
.dash-tile.clickable:hover { border-color: var(--blue); box-shadow: 0 2px 8px rgba(74,144,217,0.15); }
.dash-tile.danger { border-color: rgba(214,57,57,0.4); }
.dash-tile-label { font-size: 12px; color: var(--dim); }
.dash-tile-value { font-size: 24px; font-weight: 700; color: var(--fg-strong); margin-top: 2px; }
.dash-tile.danger .dash-tile-value { color: var(--red); }
.dash-tile-sub { font-size: 11px; color: var(--very-dim); margin-top: 2px; }

.dash-block { border: 1px solid var(--line); border-radius: var(--r); background: var(--surface); box-shadow: var(--shadow-card); }
.dash-block-head {
  display: flex; align-items: center; justify-content: space-between;
  padding: 12px 16px; border-bottom: 1px solid var(--line);
}
.dash-block-title { font-size: 14px; font-weight: 700; color: var(--fg-strong); margin: 0; }
.dash-empty { padding: 20px 16px; font-size: 12px; color: var(--very-dim); }

/* ── 로그인 / 셋업 (센터 카드) ── */
#login-page, .auth-page {
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  background: var(--page-bg);
  padding: 28px;
}
.auth-card {
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: 12px;
  box-shadow: 0 4px 16px rgba(16,24,40,0.08);
  width: 420px;
  max-width: calc(100vw - 32px);
  padding: 32px;
}
.auth-head { display: flex; flex-direction: column; align-items: center; gap: 10px; margin-bottom: 24px; text-align: center; }
.auth-logo {
  width: 48px; height: 48px;
  display: flex; align-items: center; justify-content: center;
  background: var(--green); border-radius: 10px;
  color: #fff; font-size: 26px; font-weight: 800;
  user-select: none;
}
.auth-title { font-size: 18px; font-weight: 700; color: var(--fg-strong); margin: 0; }
.auth-sub { font-size: 13px; color: var(--dim); margin: 0; }
.auth-field { margin-bottom: 14px; }
.auth-actions { display: flex; gap: 8px; margin-top: 20px; }
.auth-actions .btn { flex: 1; height: 38px; font-size: 14px; }
.auth-foot {
  margin-top: 24px; padding-top: 14px;
  border-top: 1px solid var(--line);
  font-size: 11px; color: var(--very-dim);
  text-align: center;
}
.error-line {
  color: #a12622;
  font-size: 12px;
  padding: 8px 12px;
  background: #fceeee;
  border: 1px solid rgba(214,57,57,0.3);
  border-radius: var(--r-sm);
  margin-bottom: 12px;
}

/* ── 감사 (#25~#28) ──
   diff 는 코드 리뷰의 문법을 빌린다 — 삭제선(-)은 붉게, 추가선(+)은 초록으로.
   모노스페이스 + 배경 틴트만으로 충분하다: 여기서 화려하면 데이터가 안 읽힌다. */
.audit-diff {
  font-family: var(--mono); font-size: 12px; line-height: 1.7;
  background: var(--surface-2); border: 1px solid var(--line);
  border-radius: var(--r-sm); padding: 10px 12px; margin: 0;
  white-space: pre-wrap; word-break: break-all;
}
.audit-diff .d-del { color: #c0392b; background: rgba(214,57,57,0.08); }
.audit-diff .d-add { color: #1e7e34; background: rgba(47,179,68,0.10); }
.audit-raw {
  font-family: var(--mono); font-size: 11px;
  background: var(--surface-2); border: 1px solid var(--line);
  border-radius: var(--r-sm); padding: 10px 12px;
  max-height: 420px; overflow: auto;
}
/* 버전 비교 (#32·#33) — 테이블 섹션은 접이식, 행 diff 는 감사 diff 문법을 그대로 쓴다 */
.compare-table {
  border: 1px solid var(--line); border-radius: var(--r-sm);
  padding: 8px 12px; margin: 0 4px 8px;
  background: var(--surface);
}
.compare-table > summary { cursor: pointer; list-style: none; user-select: none; }
.compare-table > summary::before { content: '▸ '; color: var(--dim); }
.compare-table[open] > summary::before { content: '▾ '; }
.compare-rows { margin-top: 8px; }
.compare-row { padding: 8px 0; border-top: 1px dashed var(--line); }

/* 표 상단에 접혀 있는 미니 감사 카드 — 접힌 줄이 곧 최신 1건 요약이다 */
.audit-mini > summary {
  cursor: pointer; font-size: 12px;
  color: var(--dim); list-style: none; user-select: none;
}
.audit-mini > summary::before { content: '▸ '; }
.audit-mini[open] > summary::before { content: '▾ '; }
.audit-mini-list {
  list-style: none; margin: 4px 0 0; padding: 6px 0 2px 14px;
  border-left: 2px solid var(--line);
  font-size: 13px;
}
.audit-mini-list li { padding: 2px 0; }

/* ── 페이지 전환 ── */
.page-fade { animation: pageFade 0.2s var(--ease); }
@keyframes pageFade { from { opacity: 0; } to { opacity: 1; } }
.page-transition { animation: pageTransition 0.2s var(--ease); }
@keyframes pageTransition { from { opacity: 0; } to { opacity: 1; } }

/* ── 접근 정책 배지 (ADR-0004) ── */
.policy-box { padding: 8px 12px; border-bottom: 1px solid var(--line); display: flex; flex-wrap: wrap; align-items: center; gap: 10px; }
.policy-badge {
  background: var(--surface); border: 1px solid var(--line-2); border-radius: 999px;
  color: var(--dim);
  font-size: 12px; padding: 3px 10px; cursor: pointer;
}
.policy-badge:hover { border-color: var(--very-dim); color: var(--fg); }
.policy-badge.danger { border-color: rgba(214,57,57,0.4); color: var(--red); background: var(--red-soft); }
.policy-panel { display: flex; gap: 16px; flex-wrap: wrap; }
.policy-opt { display: flex; align-items: center; gap: 5px; cursor: pointer; font-size: 12px; color: var(--fg); }
.policy-opt.disabled { opacity: 0.4; cursor: not-allowed; }
.policy-note { color: var(--very-dim); font-size: 11px; }

/* ── 알림(alert) — Metaplay 상단 배너 동형 ── */
.alert {
  /* Tabler 1.x 의 .alert 는 display:flex 라 자식 블록이 가로로 늘어선다.
     여기서는 아이콘 레이아웃을 쓰지 않으므로 block 으로 되돌린다. */
  display: block;
  border-radius: var(--r-sm);
  border: 1px solid var(--line);
  background: var(--surface-2);
  color: var(--fg);
  font-size: 13px;
  padding: 12px 14px;
}
.alert-danger {
  background: #fceeee;
  border-color: rgba(214,57,57,0.3);
  color: #a12622;
}
.alert-success {
  background: var(--green-soft);
  border-color: rgba(47,179,68,0.3);
  color: #1e7e34;
}
.alert-info {
  background: var(--blue-soft);
  border-color: rgba(74,144,217,0.3);
  color: var(--blue-deep);
}
.alert-warning {
  background: var(--amber-soft);
  border-color: rgba(245,159,0,0.35);
  color: #8a6100;
}

/* ── 기타 ── */
hr, .hr-text { border-color: var(--line); color: var(--dim); }
.hr-text { font-size: 11px; letter-spacing: 0.06em; }
.text-muted { color: var(--dim) !important; }
.text-secondary { color: var(--dim) !important; }
a { color: var(--blue-deep); text-decoration: none; transition: color var(--d) var(--ease); }
a:hover { color: var(--blue); }

.pagination { gap: 0; }
.pagination .page-item .page-link {
  background: var(--surface);
  border: 1px solid var(--line);
  color: var(--fg);
  font-size: 12px;
  margin: 0 -1px 0 0;
  padding: 4px 10px;
  transition: all var(--d) var(--ease);
}
.pagination .page-item:first-child .page-link { border-radius: var(--r-sm) 0 0 var(--r-sm); }
.pagination .page-item:last-child .page-link { border-radius: 0 var(--r-sm) var(--r-sm) 0; }
.pagination .page-item .page-link:hover {
  background: var(--surface-2);
  color: var(--fg-strong);
}
.pagination .page-item.active .page-link {
  background: var(--blue);
  border-color: var(--blue);
  color: #fff;
}
.pagination .page-item.disabled .page-link {
  color: var(--very-dim);
  background: var(--surface);
  border-color: var(--line);
}

/* ── OAuth/셋업 버튼 — 카드 폭을 채우는 큰 버튼 ── */
.oauth-btn {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  width: 100%;
  padding: 8px 14px;
  height: 38px;
  font-size: 13px;
  font-weight: 600;
  border-radius: var(--r-sm);
}
.oauth-divider {
  color: var(--dim); text-align: center;
  margin: 20px 0 12px;
  font-size: 11px; letter-spacing: 0.06em;
}
.oauth-list { display: grid; gap: 6px; }

/* ── 탭 (nav-tabs) ── */
.nav-tabs {
  border-bottom: 1px solid var(--line);
  gap: 0;
}
.nav-tabs .nav-link {
  background: transparent;
  border: 1px solid transparent;
  color: var(--dim);
  border-radius: var(--r-sm) var(--r-sm) 0 0;
  font-size: 13px;
  font-weight: 600;
  padding: 8px 14px;
  margin-bottom: -1px;
  transition: all var(--d) var(--ease);
}
.nav-tabs .nav-link:hover {
  color: var(--blue-deep);
  border-color: transparent;
}
.nav-tabs .nav-link.active {
  background: transparent;
  color: var(--blue-deep);
  border-color: transparent;
  border-bottom: 2px solid var(--blue);
}

/* ── 텍스트 컬러 유틸 override ── */
.text-primary { color: var(--blue-deep) !important; }
.text-success { color: var(--green) !important; }
.text-danger { color: var(--red) !important; }
.text-warning { color: var(--amber) !important; }
.text-info { color: var(--blue-deep) !important; }
.text-yellow, .text-orange { color: var(--amber) !important; }
.text-cyan, .text-blue { color: var(--blue-deep) !important; }
.text-red { color: var(--red) !important; }
.text-green { color: var(--green) !important; }

/* ── 제목 ── */
.h1, .h2, .h3, h1, h2, h3 { color: var(--fg-strong); font-weight: 700; }
.fw-bold { font-weight: 700 !important; }
.bg-light { background: var(--surface-2) !important; color: var(--fg) !important; }

/* ── 테이블 안 select/input 인라인 ── */
.table .form-select, .table .form-control {
  background: transparent;
  border: 1px solid transparent;
}
.table .form-select:hover, .table .form-control:hover {
  background: var(--surface-2);
  border-color: var(--line);
}
.table .form-select:focus, .table .form-control:focus {
  background: var(--surface);
  border-color: var(--blue);
}

/* ── 스피너 ── */
@keyframes spinnerPulse {
  0%, 100% { opacity: 0.35; }
  50%      { opacity: 1; }
}

/* ── 툴팁 ── */
.tooltip-inner {
  background: var(--fg-strong);
  color: #fff;
  font-size: 12px;
  padding: 6px 10px;
  border-radius: var(--r-sm);
}
.tooltip .tooltip-arrow::before { border-top-color: var(--fg-strong) !important; }

/* ── 검색 드롭다운 (FK) ── */
.ss-wrap { position: relative; display: block; }
.ss-display { cursor: pointer; }
.ss-display::placeholder { color: var(--very-dim); }
.ss-pop {
  position: fixed;
  /* 모달 오버레이(.icon-grid-overlay, 1090)보다 위여야 JSON 모달 안에서도 보인다 */
  z-index: 1100;
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: var(--r-sm);
  box-shadow: var(--shadow-pop);
  font-size: 12px;
  max-height: 240px; overflow-y: auto;
  padding: 4px;
}
.ss-opt {
  display: flex; align-items: baseline; gap: 8px;
  padding: 5px 10px;
  cursor: pointer;
  white-space: nowrap;
  border-radius: 4px;
  color: var(--fg);
}
.ss-opt.ss-active, .ss-opt:hover { background: var(--blue); color: #fff; }
.ss-opt.ss-active .ss-id, .ss-opt:hover .ss-id { color: #fff; opacity: 0.75; }
.ss-opt-name { flex: 1; overflow: hidden; text-overflow: ellipsis; }
.ss-id { color: var(--very-dim); font-family: var(--mono); font-size: 10px; }
.ss-clear { color: var(--red); }
.ss-empty { padding: 6px 10px; color: var(--very-dim); font-style: italic; }

/* ── 아이콘 셀 (그리드 모달 트리거) ── */
.icon-cell { display: inline-flex; align-items: center; gap: 6px; cursor: pointer; padding: 2px 4px; border-radius: 4px; max-width: 100%; }
.icon-cell:hover { background: var(--blue-soft); }
.icon-cell-thumb { width: 24px; height: 24px; object-fit: contain; image-rendering: pixelated; flex: 0 0 auto; }
.icon-cell-noimg { width: 24px; height: 24px; display: inline-flex; align-items: center; justify-content: center; color: var(--very-dim); flex: 0 0 auto; }
.icon-cell-name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

/* ── 아이콘 그리드 모달 ── */
.icon-grid-overlay { position: fixed; inset: 0; z-index: 1090; background: var(--bg-overlay); display: flex; align-items: center; justify-content: center; }
.icon-grid-panel {
  background: var(--surface); border: 1px solid var(--line); border-radius: var(--r);
  box-shadow: var(--shadow-modal);
  width: min(640px, calc(100vw - 40px)); max-height: 70vh;
  display: flex; flex-direction: column;
}
.icon-grid-head { display: flex; align-items: center; gap: 8px; padding: 12px; border-bottom: 1px solid var(--line); }
.icon-grid-search { flex: 1; }
/* 닫기는 언제나 우측 상단. 검색창(flex:1)이 없는 모달에서는 제목에 붙어버리므로 auto 로 민다. */
.icon-grid-close { margin-left: auto; background: transparent; border: 1px solid var(--line); border-radius: var(--r-sm); color: var(--dim); width: 32px; height: 32px; flex-shrink: 0; cursor: pointer; font-size: 16px; }
.icon-grid-close:hover { border-color: var(--very-dim); color: var(--fg); }
.icon-grid-body { padding: 12px; overflow-y: auto; display: grid; grid-template-columns: repeat(auto-fill, minmax(84px, 1fr)); gap: 8px; }
.icon-grid-cell { display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 8px 4px; cursor: pointer; border: 1px solid transparent; border-radius: var(--r-sm); }
.icon-grid-cell:hover { border-color: var(--line-2); background: var(--surface-2); }
.icon-grid-cell.sel { border-color: var(--blue); background: var(--blue-soft); }
.icon-grid-cell img { width: 48px; height: 48px; object-fit: contain; image-rendering: pixelated; }
.icon-grid-x { width: 48px; height: 48px; display: flex; align-items: center; justify-content: center; color: var(--red); font-size: 20px; }
.icon-grid-label { font-size: 10px; color: var(--fg); text-align: center; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 100%; }
.icon-grid-empty { padding: 24px; text-align: center; color: var(--very-dim); grid-column: 1 / -1; }

/* ── 단축키 치트시트 ── */
.keymap-overlay {
  position: fixed; inset: 0; z-index: 1090;
  background: var(--bg-overlay);
  display: flex; align-items: center; justify-content: center;
}
.keymap-panel {
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: var(--r);
  box-shadow: var(--shadow-modal);
  padding: 20px 24px; min-width: 380px;
  font-size: 13px;
}
.keymap-title {
  color: var(--fg-strong); font-weight: 700;
  font-size: 14px; margin-bottom: 14px;
}
.keymap-row { display: flex; align-items: center; gap: 16px; padding: 4px 0; }
.keymap-row kbd {
  flex: 0 0 210px; text-align: right;
  color: var(--fg-strong); background: var(--surface-2);
  border: 1px solid var(--line); border-radius: 4px; box-shadow: none;
  font-family: var(--mono); font-size: 11px; padding: 2px 6px;
}
.keymap-row span { color: var(--fg); }
.keymap-hint { margin-top: 14px; color: var(--very-dim); font-size: 11px; text-align: center; }

/* ── 컬럼 ellipsis (자동/수동 너비 + wrap 토글에 맞춰) ── */
.table thead th { overflow: hidden; text-overflow: ellipsis; }

/* ── 컬럼 우클릭 컨텍스트 메뉴 ── */
.col-menu {
  position: fixed;
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: var(--r-sm);
  font-size: 13px;
  padding: 4px;
  z-index: 9999;
  min-width: 200px;
  box-shadow: var(--shadow-pop);
}
.col-menu-item {
  padding: 7px 12px;
  color: var(--fg);
  cursor: pointer;
  user-select: none;
  border-radius: 4px;
}
.col-menu-item:hover { background: var(--blue); color: #fff; }

/* ── [Polymorphic] 편집기 — 타입 하나 고르고 그 타입 필드만 채우는 세로 표 ── */
.poly-type {

<script>
// 이 인라인 script 의 존재 이유는 하나다 — **플레이스holder 치환**.
// vite 는 type="module" 이 아닌 인라인 script 를 번들하지 않으므로 {{...}} 가 여기서만 살아남는다.
// React 번들 안에 쓰면 문자열이 그대로 남아 배포가 조용히 깨진다.
window.__SUPARUN_ENV = (function () {
  var url = '{{SUPABASE_URL}}';
  var anonKey = '{{SUPABASE_ANON_KEY}}';
  var ref = '';
  try { ref = new URL(url).hostname.split('.')[0]; } catch (e) { ref = ''; }
  return { supabaseUrl: url, supabaseAnonKey: anonKey, projectRef: ref };
})();

// 부팅 실패 방어 — React 가 뜨기만 하면 이후 에러는 React 쪽에서 다룬다.
function __suparunBootError(msg) {
  var box = document.getElementById('boot-error');
  var el = document.getElementById('boot-error-msg');
  if (!box || !el) return;
  box.style.display = '';
  el.textContent = msg;
}
window.onerror = function (msg, src, line) {
  __suparunBootError(msg + ' (' + (src || '') + ':' + (line || '') + ')');
  console.error('Admin Error:', msg, src, line);
};
window.addEventListener('unhandledrejection', function (e) {
  __suparunBootError((e.reason && e.reason.message) || String(e.reason));
  console.error('Unhandled rejection:', e.reason);
});

// ============================================================
// PREVIEW MODE — 디자인 미리보기용 (file:// 또는 ?mock=1)
// 프로덕션 deploy 시에도 코드 그대로 두면 됨. file://가 아니면 자동 비활성.
// ============================================================
(function setupPreviewMode() {
  const isPreview = window.location.protocol === 'file:'
                 || new URLSearchParams(location.search).has('mock');

      name: 'PerkConfig', tableName: 'perk_config', group: 'InGame',

        { name: 'id', type: 'string', isPrimaryKey: true, isNotNull: true },
        { name: 'display_name', type: 'string', isNotNull: true },
        { name: 'icon_key', type: 'string' },
        { name: 'activation_type', type: 'string', isEnum: true, enumValues: ['Passive','Skill','FieldOrb'] },
        {
          name: 'tiers', type: 'string', isJson: true,
          jsonSchema: [
            { name: 'rarity', type: 'string', isEnum: true, enumValues: ['Common','Rare','Epic','Legendary','Mythic'] },
            { name: 'description', type: 'string' },
            { name: 'respawn_cooldown', type: 'float' },
            { name: 'activation_type', type: 'string', isEnum: true, enumValues: ['Passive','Skill','FieldOrb'] },
            { name: 'field_orb_id', type: 'string', foreignKey: 'FieldOrbConfig', visibleIf: { field: 'activation_type', values: ['FieldOrb'] } },
            { name: 'skill_id', type: 'string', foreignKey: 'SkillConfig', visibleIf: { field: 'activation_type', values: ['Skill'] } },
            {
              name: 'stat_bonuses', type: 'string', isJson: true,
              visibleIf: { field: 'activation_type', values: ['Passive'] },
              jsonSchema: [
                { name: 'stat_id', type: 'string' },
                { name: 'value', type: 'float' },
                { name: 'mod_type', type: 'string', isEnum: true, enumValues: ['flat','percent'] }
              ]
            }
          ]
        }
      ]
    },
    {
      name: 'SkillConfig', tableName: 'skill_config', group: 'InGame',
      fields: [
        { name: 'id', type: 'string', isPrimaryKey: true, isNotNull: true },
        { name: 'display_name', type: 'string', isNotNull: true },
        { name: 'pattern_type', type: 'string', isEnum: true, enumValues: ['Gun','Sword','AreaDamage','Buff'] },
        { name: 'magazine_size', type: 'int' },
        { name: 'fire_interval', type: 'float' },
        { name: 'reload_time', type: 'float' },
        { name: 'damage', type: 'float' },
        { name: 'projectile_speed', type: 'float' }
      ]
    },
    {
      name: 'FieldOrbConfig', tableName: 'field_orb_config', group: 'InGame',
      fields: [
        { name: 'id', type: 'string', isPrimaryKey: true, isNotNull: true },
        { name: 'display_name', type: 'string', isNotNull: true },
        { name: 'sprite_key', type: 'string' },
        { name: 'skill_id', type: 'string', foreignKey: 'SkillConfig' },
        { name: 'skill_duration', type: 'float' },
        { name: 'pickup_radius', type: 'float' }
      ]
    }
  ];

  const tiersJson = JSON.stringify([
    { rarity: 'Common',    description: '4발 사격 후 장전, 반복',                                 respawn_cooldown: 30, activation_type: 'FieldOrb', field_orb_id: 'burst_gun_orb_Common',    skill_id: null, stat_bonuses: null },
    { rarity: 'Rare',      description: '8발 사격, 인터벌 절반',                                   respawn_cooldown: 30, activation_type: 'FieldOrb', field_orb_id: 'burst_gun_orb_Rare',      skill_id: null, stat_bonuses: null },
    { rarity: 'Epic',      description: '데미지 2배, 탄환 비주얼 변경',                             respawn_cooldown: 30, activation_type: 'FieldOrb', field_orb_id: 'burst_gun_orb_Epic',      skill_id: null, stat_bonuses: null },
    { rarity: 'Legendary', description: '장전 제거(영구 사격), 데미지·탄속 증가, 주변 발사 이펙트', respawn_cooldown: 30, activation_type: 'FieldOrb', field_orb_id: 'burst_gun_orb_Legendary', skill_id: null, stat_bonuses: null },
    { rarity: 'Mythic',    description: '탄크기 증가, 비주얼·이펙트 변경, 데미지 증가, 관통',       respawn_cooldown: 30, activation_type: 'FieldOrb', field_orb_id: 'burst_gun_orb_Mythic',    skill_id: null, stat_bonuses: null }
  ]);

  const MOCK_DB = {
    perk_config: [
      { id: 'perk_burst_gun', display_name: '따발총', icon_key: null, activation_type: 'FieldOrb', tiers: tiersJson }
    ],
    skill_config: [
      { id: 'skill_burst_gun_Common',    display_name: '따발총 T1',     pattern_type: 'Gun', magazine_size: 4,    fire_interval: 0.13,  reload_time: 1.0,  damage: 5,  projectile_speed: 45 },
      { id: 'skill_burst_gun_Rare',      display_name: '따발총 T2',     pattern_type: 'Gun', magazine_size: 8,    fire_interval: 0.065, reload_time: 1.0,  damage: 5,  projectile_speed: 45 },
      { id: 'skill_burst_gun_Epic',      display_name: '따발총 T3',     pattern_type: 'Gun', magazine_size: 8,    fire_interval: 0.065, reload_time: 1.0,  damage: 10, projectile_speed: 45 },
      { id: 'skill_burst_gun_Legendary', display_name: '따발총 T4',     pattern_type: 'Gun', magazine_size: 9999, fire_interval: 0.05,  reload_time: 0.01, damage: 15, projectile_speed: 60 },
      { id: 'skill_burst_gun_Mythic',    display_name: '따발총 T5',     pattern_type: 'Gun', magazine_size: 9999, fire_interval: 0.05,  reload_time: 0.01, damage: 25, projectile_speed: 60 }
    ],
    field_orb_config: [
      { id: 'burst_gun_orb_Common',    display_name: '따발총 T1', sprite_key: 'Burst_Gun', skill_id: 'skill_burst_gun_Common',    skill_duration: 10, pickup_radius: 1 },

      { id: 'burst_gun_orb_Epic',      display_name: '따발총 T3', sprite_key: 'Burst_Gun', skill_id: 'skill_burst_gun_Epic',      skill_duration: 10, pickup_radius: 1 },
      { id: 'burst_gun_orb_Legendary', display_name: '따발총 T4', sprite_key: 'Burst_Gun', skill_id: 'skill_burst_gun_Legendary', skill_duration: 10, pickup_radius: 1 },
      { id: 'burst_gun_orb_Mythic',    display_name: '따발총 T5', sprite_key: 'Burst_Gun', skill_id: 'skill_burst_gun_Mythic',    skill_duration: 10, pickup_radius: 1 }
    ]
  };

  // ── api 함수가 호출하는 mock 처리기 ──
  window.__previewApi = async function(path, method, body) {
    console.log(`[PREVIEW] ${method} ${path}`, body || '');
    const clean = path.replace(/^\/+/, '');
    const parts = clean.split('/');
    const tableName = parts[0];

    if (tableName === '_types') return MOCK_TYPES;
    if (tableName === '_audit') return [];

    const data = MOCK_DB[tableName];
    if (!data) return method === 'DELETE' ? null : [];

    if (parts.length === 1) {
      if (method === 'POST' && body) { data.push(body); return body; }
      return data;
    }
    const id = parts[1];
    const idx = data.findIndex(r => r.id === id);
    if (method === 'PUT' && body) { if (idx >= 0) data[idx] = body; else data.push(body); return body; }
    if (method === 'DELETE') { if (idx >= 0) data.splice(idx, 1); return null; }
    return data[idx] ?? null;
  };

  // ── tableApi mock (Table 메타 — Config와 별개. 빈 배열로 충분) ──
  window.__previewTableApi = async function(path, method, body) {
    console.log(`[PREVIEW table] ${method} ${path}`, body || '');
    const clean = path.replace(/^\/+/, '');
    if (clean === '_types' || clean === '') return [];
    return method === 'DELETE' ? null : [];
  };

  // ── adminApi mock (관리자 관리 — 미리보기엔 빈 결과) ──
  window.__previewAdminApi = async function(path, method, body) {
    console.log(`[PREVIEW admin] ${method} ${path}`, body || '');
    return method === 'DELETE' ? null : [];
  };

  // 어드민 자동 진입은 App.tsx 가 __SUPARUN_PREVIEW__ 를 보고 처리한다.

  console.log('%c[SupaRun PREVIEW MODE] METAPLAY LIGHT', 'background:#4a90d9;color:#fff;padding:2px 6px;font-weight:700');
})();

</script>
