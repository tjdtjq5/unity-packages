<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SupaRun Admin</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/core@1.2.0/dist/css/tabler.min.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.30.0/dist/tabler-icons.min.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.min.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700;800&display=swap">
<style>
/* ============================================================
   SupaRun Admin — Brutalist Terminal
   CRT phosphor + ASCII tree + zero radius. Green on black.
   ============================================================ */

:root, [data-bs-theme="dark"] {
  /* 컬러 */
  --bg:        #000000;
  --bg-1:      #050807;
  --bg-2:      #0a0f0a;
  --bg-3:      #121a12;
  --line:      #1a2a1a;
  --line-2:    #2a3a2a;
  --fg:        #d8e4d8;
  --dim:       #6b7d6b;
  --very-dim:  #3a4a3a;
  --green:     #00ff66;
  --green-2:   #00cc52;
  --green-glow: rgba(0,255,102,0.4);
  --green-soft: rgba(0,255,102,0.08);
  --amber:     #ffb000;
  --amber-soft: rgba(255,176,0,0.1);
  --red:       #ff3344;
  --red-soft:  rgba(255,51,68,0.1);

  /* Legacy alias (CSS 안에서 옛 이름 참조해도 안전) */
  --bg-primary:    var(--bg);
  --bg-surface:    var(--bg-2);
  --bg-elevated:   var(--bg-3);
  --bg-overlay:    rgba(0,0,0,0.85);
  --border:        var(--line);
  --border-strong: var(--line-2);
  --text-primary:  var(--fg);
  --text-secondary:var(--dim);
  --text-tertiary: var(--very-dim);
  --accent:        var(--green);
  --accent-hover:  var(--green-2);
  --accent-glow:   var(--green-glow);
  --accent-soft:   var(--green-soft);
  --success:       var(--green);
  --warning:       var(--amber);
  --danger:        var(--red);

  /* Tabler/Bootstrap 변수 override */
  --tblr-bg-surface: var(--bg-2);
  --tblr-bg-surface-secondary: var(--bg-3);
  --tblr-body-bg: var(--bg);
  --tblr-body-color: var(--fg);
  --tblr-border-color: var(--line);
  --tblr-border-color-translucent: var(--line);
  --tblr-primary: var(--green);
  --tblr-primary-rgb: 0,255,102;
  --tblr-link-color: var(--green);
  --tblr-secondary: var(--dim);
  --tblr-muted: var(--very-dim);
  --tblr-danger: var(--red);
  --tblr-success: var(--green);
  --tblr-warning: var(--amber);
  --bs-body-bg: var(--bg);
  --bs-body-color: var(--fg);
  --bs-border-color: var(--line);
  --bs-primary: var(--green);
  --bs-primary-rgb: 0,255,102;
  --bs-secondary-color: var(--dim);
  --bs-tertiary-bg: var(--bg-3);
  --bs-emphasis-color: var(--fg);

  /* 폰트 */
  --mono: 'JetBrains Mono','SF Mono',Consolas,monospace;
  --kr:   'Pretendard Variable','Pretendard',sans-serif;
  --font-sans: var(--mono), var(--kr);
  --font-mono: var(--mono);

  /* 모션 */
  --d-fast: 100ms;
  --d:      150ms;
  --ease:   linear;
  --duration-fast: var(--d-fast);
  --duration:      var(--d);
  --duration-slow: 260ms;
  --ease-out: linear;
}

/* ── 베이스 ── */
*, *::before, *::after { border-color: var(--line); }
* { box-sizing: border-box; }

html { background: var(--bg); }
body {
  background:
    repeating-linear-gradient(0deg, rgba(0,255,102,0.04) 0 1px, transparent 1px 3px),
    radial-gradient(ellipse at 50% 0%, rgba(0,255,102,0.08), transparent 70%),
    var(--bg);
  background-attachment: fixed;
  color: var(--fg);
  font-family: var(--mono), var(--kr);
  font-size: 13px;
  line-height: 1.5;
  font-feature-settings: 'zero', 'ss01';
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
  min-height: 100vh;
  position: relative;
}
body::after {
  content: '';
  position: fixed; inset: 0;
  pointer-events: none; z-index: 999;
  background: radial-gradient(ellipse 100% 90% at 50% 50%, transparent 70%, rgba(0,0,0,0.5));
}
code, kbd, pre, samp, .text-mono, .font-mono { font-family: var(--mono); font-size: 0.95em; }
::selection { background: var(--green); color: var(--bg); }

/* 스크롤바 */
::-webkit-scrollbar { width: 8px; height: 8px; }
::-webkit-scrollbar-track { background: var(--bg); }
::-webkit-scrollbar-thumb { background: var(--very-dim); border: 2px solid var(--bg); background-clip: padding-box; }
::-webkit-scrollbar-thumb:hover { background: var(--green-2); border: 2px solid var(--bg); background-clip: padding-box; }

/* ── Terminal Titlebar (상단) ── */
.terminal-titlebar {
  display: flex; align-items: center; justify-content: space-between;
  padding: 8px 18px; border-bottom: 1px solid var(--line);
  background: rgba(0,0,0,0.6); font-size: 11px; color: var(--green);
  letter-spacing: 0.05em; font-family: var(--mono); font-weight: 700;
  position: relative; z-index: 5;
}
.terminal-titlebar .dot {
  display: inline-block; width: 8px; height: 8px; margin-right: 8px;
  background: var(--green); border-radius: 50%;
  box-shadow: 0 0 8px var(--green); animation: blink 1.6s linear infinite;
  vertical-align: middle;
}
.terminal-titlebar .title { vertical-align: middle; }
.terminal-titlebar .meta { color: var(--dim); font-size: 10px; letter-spacing: 0.1em; }
@keyframes blink { 0%, 60% { opacity: 1; } 80% { opacity: 0.3; } }

/* ── Terminal Prompt (페이지 상단) ── */
.terminal-prompt {
  font-family: var(--mono);
  font-size: 12px; color: var(--green-2); margin-bottom: 22px;
  padding: 10px 16px; border-bottom: 1px solid var(--line);
  letter-spacing: 0.02em;
}
.terminal-prompt .user { color: var(--green); font-weight: 700; }
.terminal-prompt .sep { color: var(--dim); }
.terminal-prompt .path { color: var(--fg); }
.terminal-prompt .cmd { color: var(--amber); }
.terminal-prompt .arg { color: var(--green); }
.terminal-prompt .cursor { animation: cursor 1s linear infinite; }
@keyframes cursor { 50% { opacity: 0; } }

/* ── 사이드바 (ASCII tree) ── */
.navbar-vertical,
.navbar-vertical.navbar-expand-lg > .container-fluid {
  background: var(--bg-1);
  border-right: 1px solid var(--line);
  border-radius: 0;
  width: 240px;
  min-width: 240px;
  padding: 0;
  display: flex;
  flex-direction: column;
}
.navbar-vertical .container-fluid {
  display: flex; flex-direction: column;
  padding: 22px 0; height: 100%;
  align-items: stretch;
}
.navbar-vertical .navbar-brand {
  padding: 0 18px 14px;
  margin: 0;
  border-bottom: 1px dashed var(--line);
  color: var(--green);
  font-family: var(--mono); font-weight: 700;
  font-size: 11px; letter-spacing: 0.1em;
  text-transform: uppercase;
}
.navbar-vertical .navbar-brand i { color: var(--amber); }
.collapse.navbar-collapse {
  display: flex !important;
  flex-direction: column;
  flex: 1;
  margin-top: 14px;
}
.sidebar-prompt {
  padding: 0 18px 14px;
  border-bottom: 1px dashed var(--line);
  font-family: var(--mono);
  font-size: 11px;
  color: var(--green);
  letter-spacing: 0.05em;
  text-transform: uppercase;
}
.sidebar-prompt .dim { color: var(--dim); }
.tree-section {
  font-family: var(--mono);
  font-size: 10px; font-weight: 700; color: var(--amber);
  letter-spacing: 0.12em; padding: 14px 18px 6px;
  text-transform: uppercase;
}
.tree-list { display: flex; flex-direction: column; }
.tree-item {
  display: flex; align-items: center; gap: 8px;
  padding: 4px 18px; color: var(--fg);
  font-family: var(--mono); font-size: 12px;
  cursor: pointer; text-decoration: none;
  transition: color var(--d-fast) var(--ease), background var(--d-fast) var(--ease);
  position: relative;
}
.tree-item:hover { color: var(--green); background: var(--green-soft); }
.tree-item.active { color: var(--green); }
.tree-item.active::before { content: '▶ '; color: var(--green); flex-shrink: 0; }
.tree-item .branch { color: var(--very-dim); user-select: none; flex-shrink: 0; }
.tree-item .num {
  margin-left: auto; color: var(--dim); font-size: 10px;
  padding-left: 6px;
}
.tree-item .label { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

.sidebar-status {
  margin-top: auto; padding: 12px 18px;
  border-top: 1px dashed var(--line);
  font-family: var(--mono);
  font-size: 10px; color: var(--dim); line-height: 1.7;
}
.sidebar-status .ok { color: var(--green); animation: blink 1.6s linear infinite; }
.sidebar-status .lbl { color: var(--very-dim); margin-right: 6px; }
.sidebar-status .row { display: flex; gap: 6px; align-items: baseline; }

/* 기존 navbar nav 호환 (안 쓰지만 안전망) */
.navbar-vertical .nav-item { margin: 0; }
.navbar-vertical .nav-link, .sidebar-link {
  color: var(--fg) !important;
  border-radius: 0;
  padding: 4px 18px;
  font-family: var(--mono);
  font-size: 12px;
  letter-spacing: 0.02em;
  transition: background var(--d-fast) var(--ease), color var(--d-fast) var(--ease);
  position: relative;
}
.navbar-vertical .nav-link:hover, .sidebar-link:hover {
  background: var(--green-soft);
  color: var(--green) !important;
}
.navbar-vertical .nav-link.active, .sidebar-link.active {
  background: var(--green-soft) !important;
  color: var(--green) !important;
  border-radius: 0;
}
.nav-link-icon { width: 16px; height: 16px; font-size: 14px; color: inherit; opacity: 0.7; }
.sidebar-section-label {
  font-family: var(--mono);
  font-size: 10px;
  text-transform: uppercase;
  letter-spacing: 0.12em;
  font-weight: 700;
  color: var(--amber);
  padding: 14px 18px 6px;
  margin: 0;
}

/* 드롭다운 */
.dropdown-menu {
  background: var(--bg-1);
  border: 1px solid var(--green-2);
  border-radius: 0;
  padding: 0;
  box-shadow: 0 0 0 1px var(--green-soft), 0 12px 32px rgba(0,0,0,0.7);
  font-family: var(--mono); font-size: 11px;
}
.dropdown-item {
  color: var(--fg);
  border-radius: 0;
  padding: 6px 12px;
  font-family: var(--mono); font-size: 11px;
  letter-spacing: 0.02em;
  transition: background var(--d-fast) var(--ease), color var(--d-fast) var(--ease);
}
.dropdown-item:hover, .dropdown-item:focus {
  background: var(--green);
  color: var(--bg);
}
.dropdown-toggle::after { opacity: 0.6; }

/* ── 검색 드롭다운 (FK) ── */
.ss-wrap { position: relative; display: block; }
.ss-display { cursor: pointer; }
.ss-display::placeholder { color: var(--very-dim); }
.ss-pop {
  position: fixed;
  /* 모달 오버레이(.icon-grid-overlay, 1090)보다 위여야 JSON 모달 안에서도 보인다 */
  z-index: 1100;
  background: var(--bg-1);
  border: 1px solid var(--green-2);
  box-shadow: 0 0 0 1px var(--green-soft), 0 12px 32px rgba(0,0,0,0.7);
  font-family: var(--mono); font-size: 11px;
  max-height: 240px; overflow-y: auto;
  padding: 0;
}
.ss-opt {
  display: flex; align-items: baseline; gap: 8px;
  padding: 5px 10px;
  cursor: pointer;
  white-space: nowrap;
  border-bottom: 1px solid var(--line);
  color: var(--fg);
}
.ss-opt:last-child { border-bottom: 0; }
.ss-opt.ss-active, .ss-opt:hover { background: var(--green); color: var(--bg); }
.ss-opt.ss-active .ss-id, .ss-opt:hover .ss-id { color: var(--bg); opacity: 0.7; }
.ss-opt-name { flex: 1; overflow: hidden; text-overflow: ellipsis; }
.ss-id { color: var(--dim); font-size: 10px; }
.ss-clear { color: var(--amber); }
.ss-empty { padding: 6px 10px; color: var(--very-dim); font-style: italic; }

/* ── 아이콘 셀 (그리드 모달 트리거) ── */
.icon-cell { display: inline-flex; align-items: center; gap: 6px; cursor: pointer; padding: 2px 4px; max-width: 100%; }
.icon-cell:hover { background: var(--green-soft); }
.icon-cell-thumb { width: 24px; height: 24px; object-fit: contain; image-rendering: pixelated; flex: 0 0 auto; }
.icon-cell-noimg { width: 24px; height: 24px; display: inline-flex; align-items: center; justify-content: center; color: var(--very-dim); flex: 0 0 auto; }
.icon-cell-name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

/* ── 아이콘 그리드 모달 ── */
.icon-grid-overlay { position: fixed; inset: 0; z-index: 1090; background: rgba(0,0,0,0.7); display: flex; align-items: center; justify-content: center; }
.icon-grid-panel {
  background: var(--bg-1); border: 1px solid var(--green-2);
  box-shadow: 0 0 0 1px var(--green-soft), 0 16px 48px rgba(0,0,0,0.8);
  width: min(640px, calc(100vw - 40px)); max-height: 70vh;
  display: flex; flex-direction: column; font-family: var(--mono);
}
.icon-grid-head { display: flex; align-items: center; gap: 8px; padding: 12px; border-bottom: 1px solid var(--line); }
.icon-grid-search { flex: 1; }
/* 닫기는 언제나 우측 상단. 검색창(flex:1)이 없는 모달에서는 제목에 붙어버리므로 auto 로 민다. */
.icon-grid-close { margin-left: auto; background: transparent; border: 1px solid var(--line); color: var(--fg); width: 32px; height: 32px; flex-shrink: 0; cursor: pointer; font-size: 16px; }
.icon-grid-close:hover { border-color: var(--green); color: var(--green); }
.icon-grid-body { padding: 12px; overflow-y: auto; display: grid; grid-template-columns: repeat(auto-fill, minmax(84px, 1fr)); gap: 8px; }
.icon-grid-cell { display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 8px 4px; cursor: pointer; border: 1px solid transparent; }
.icon-grid-cell:hover { border-color: var(--green-2); background: var(--green-soft); }
.icon-grid-cell.sel { border-color: var(--green); background: var(--green-soft); }
.icon-grid-cell img { width: 48px; height: 48px; object-fit: contain; image-rendering: pixelated; }
.icon-grid-x { width: 48px; height: 48px; display: flex; align-items: center; justify-content: center; color: var(--amber); font-size: 20px; }
.icon-grid-label { font-size: 10px; color: var(--fg); text-align: center; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 100%; }
.icon-grid-empty { padding: 24px; text-align: center; color: var(--very-dim); grid-column: 1 / -1; }

/* ── 단축키 치트시트 ── */
.keymap-overlay {
  position: fixed; inset: 0; z-index: 1090;
  background: rgba(0,0,0,0.7);
  display: flex; align-items: center; justify-content: center;
}
.keymap-panel {
  background: var(--bg-1);
  border: 1px solid var(--green-2);
  box-shadow: 0 0 0 1px var(--green-soft), 0 16px 48px rgba(0,0,0,0.8);
  padding: 20px 24px; min-width: 380px;
  font-family: var(--mono); font-size: 12px;
}
.keymap-title {
  color: var(--green); font-weight: 700; letter-spacing: 0.12em;
  font-size: 11px; margin-bottom: 14px; text-transform: uppercase;
}
.keymap-row { display: flex; align-items: center; gap: 16px; padding: 4px 0; }
.keymap-row kbd {
  flex: 0 0 210px; text-align: right;
  color: var(--amber); background: transparent; border: 0; box-shadow: none;
  font-family: var(--mono); font-size: 11px; padding: 0;
}
.keymap-row span { color: var(--fg); }
.keymap-hint { margin-top: 14px; color: var(--very-dim); font-size: 10px; text-align: center; }

/* ── 페이지 헤더 ── */
.page-wrapper, .page, .container, .container-xl, .container-fluid { background: transparent; }
.page-wrapper { padding: 0; }
.page-header {
  border-bottom: 1px solid var(--line);
  padding: 14px 0 12px;
  margin-bottom: 16px;
  background: transparent;
}
.page-pretitle {
  font-family: var(--mono);
  font-size: 10px;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color: var(--amber);
}
.page-title {
  font-family: var(--mono);
  font-size: 14px;
  font-weight: 700;
  letter-spacing: 0.02em;
  text-transform: uppercase;
  color: var(--green);
  margin: 0;
}

/* ── 카드 ── */
.card {
  background: var(--bg-1);
  border: 1px solid var(--line);
  border-radius: 0;
  box-shadow: none;
  color: var(--fg);
}
.card-header {
  background: transparent;
  border-bottom: 1px solid var(--line);
  padding: 12px 16px;
  border-radius: 0;
}
.card-title {
  font-family: var(--mono);
  font-size: 11px;
  font-weight: 700;
  letter-spacing: 0.05em;
  text-transform: uppercase;
  color: var(--green);
  margin: 0;
}
.card-body { padding: 16px; }
.card-footer { background: transparent; border-top: 1px solid var(--line); border-radius: 0; }
.card-md, .card-sm { box-shadow: none; border-radius: 0; }

/* ── 테이블 ── */
.table {
  background: transparent;
  color: var(--fg);
  font-family: var(--mono);
  font-size: 12px;
  margin: 0;
  --bs-table-bg: transparent;
  --bs-table-color: var(--fg);
  --bs-table-border-color: var(--line);
  --bs-table-striped-bg: rgba(0,255,102,0.02);
  --bs-table-striped-color: var(--fg);
}
.table > :not(caption) > * > * {
  background: transparent;
  color: var(--fg);
  border-bottom-color: var(--line);
}
.table thead th {
  background: var(--bg-2);
  border-bottom: 1px solid var(--line);
  border-top: none;
  font-family: var(--mono);
  font-size: 10px;
  font-weight: 700;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color: var(--amber);
  padding: 10px 12px;
  white-space: nowrap;
  position: sticky;
  top: 0;
  z-index: 10;
}
/* ── 메인 Config 시트: 컨테이너에 viewport-fit 높이 부여 → 가로 스크롤바 항상 노출 + thead sticky 정상 작동 ── */
#table-container {
  max-height: calc(100vh - 240px);
  overflow: auto;
}
.table tbody td {
  padding: 8px 12px;
  height: 32px;
  vertical-align: middle;
  color: var(--fg);
  border-bottom: 1px solid var(--line);
}
.table-hover > tbody > tr {
  transition: background var(--d-fast) var(--ease);
  --bs-table-hover-bg: transparent;
}
.table-hover > tbody > tr:hover > * { background: rgba(0,255,102,0.04); }
.cell-edit {
  cursor: pointer;
  min-height: 1.5em;
  padding: 2px 6px;
  border-radius: 0;
  transition: background var(--d-fast) var(--ease);
}
.cell-edit:hover { background: var(--green-soft); }
.cell-saved { animation: cellSaved 1s linear; }
@keyframes cellSaved {
  0%   { background: var(--green-soft); box-shadow: inset 0 0 0 1px var(--green); }
  100% { background: transparent; box-shadow: none; }
}
.cell-input {
  width: 100%;
  background: var(--bg-1);
  border: 1px solid var(--green);
  border-radius: 0;
  padding: 2px 6px;
  outline: none;
  color: var(--green);
  font-family: var(--mono);
  font-size: 12px;
  transition: box-shadow var(--d) var(--ease);
}
.cell-input:focus { box-shadow: 0 0 0 1px var(--green-glow); }
.cell-na {
  display: block;
  text-align: center;
  color: var(--very-dim);
  background: transparent;
  padding: 2px 0;
  cursor: not-allowed;
  user-select: none;
  font-family: var(--mono);
  font-size: 10px;
}
.row-highlight { animation: rowHighlight 1s linear; }
@keyframes rowHighlight {
  0%   { background: var(--green-soft); box-shadow: inset 3px 0 0 var(--green); }
  100% { background: transparent; box-shadow: none; }
}
.row-enter { animation: rowEnter 0.25s linear both; }
@keyframes rowEnter {
  from { opacity: 0; transform: translateY(-4px); }
  to   { opacity: 1; transform: translateY(0); }
}
tbody tr { animation: rowStagger 0.2s linear both; }
@keyframes rowStagger { from { opacity: 0; } to { opacity: 1; } }
.row-delete { animation: rowDelete 0.25s linear forwards; }
@keyframes rowDelete {
  to { opacity: 0; transform: translateX(20px); max-height: 0; padding: 0; overflow: hidden; }
}
.th-resize {
  position: absolute;
  right: 0; top: 0; bottom: 0;
  width: 5px;
  cursor: col-resize;
  user-select: none;
  z-index: 2;
}
.th-resize:hover, .th-resize.active { background: var(--green); opacity: 0.5; }
.col-resizing { cursor: col-resize !important; user-select: none !important; }

/* PK/ID 컬럼 (첫 컬럼) green */
.table tbody td:first-child {
  font-family: var(--mono);
  font-size: 12px;
  color: var(--green);
  letter-spacing: 0.02em;
}

/* ── 폼 ── */
.form-control, .form-select {
  background: transparent;
  border: 1px solid var(--line);
  color: var(--fg);
  border-radius: 0;
  font-family: var(--mono);
  font-size: 12px;
  padding: 6px 10px;
  height: 32px;
  transition: border-color var(--d) var(--ease), box-shadow var(--d) var(--ease), background var(--d) var(--ease);
}
.form-control:focus, .form-select:focus {
  background: var(--bg-1);
  border-color: var(--green);
  box-shadow: 0 0 0 1px var(--green-glow);
  color: var(--fg);
  outline: none;
}
.form-control::placeholder { color: var(--very-dim); }
.form-control-sm, .form-select-sm { font-size: 11px; padding: 4px 8px; height: 28px; }
.form-label {
  font-family: var(--mono);
  font-size: 10px; font-weight: 700;
  text-transform: uppercase; letter-spacing: 0.1em;
  color: var(--amber);
  margin-bottom: 4px;
}
.input-group-text {
  background: var(--bg-1);
  border-color: var(--line);
  color: var(--dim);
  font-family: var(--mono);
  border-radius: 0;
}
.input-icon-addon { color: var(--dim); }
.form-check-input {
  background-color: transparent;
  border: 1px solid var(--line-2);
  border-radius: 0;
}
.form-check-input:checked {
  background-color: var(--green);
  border-color: var(--green);
}
.form-check-input:focus {
  border-color: var(--green);
  box-shadow: 0 0 0 1px var(--green-glow);
}
/* 스위치는 예외적으로 pill 유지 — 각진 트랙 + 원형 노브(SVG) 조합이 어색함.
   !important: 아래 전역 리셋(input... { border-radius: 0 !important })을 이기기 위해 필수 */
.form-switch .form-check-input { border-radius: 2em !important; }

/* ── 버튼 ── */
.btn {
  background: transparent;
  border: 1px solid var(--green-2);
  color: var(--green);
  font-family: var(--mono);
  font-size: 11px;
  font-weight: 700;
  letter-spacing: 0.05em;
  text-transform: uppercase;
  border-radius: 0;
  padding: 6px 14px;
  height: 32px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  transition: background var(--d) var(--ease), border-color var(--d) var(--ease), color var(--d) var(--ease);
}
.btn:hover { background: var(--green); color: var(--bg); border-color: var(--green); }
.btn-sm { font-size: 10px; padding: 4px 10px; height: 28px; }
.btn-primary {
  background: var(--green);
  border-color: var(--green);
  color: var(--bg);
}
.btn-primary:hover {
  background: var(--fg);
  border-color: var(--fg);
  color: var(--bg);
}
.btn-primary:active { background: var(--green-2); }
.btn-outline-primary,
.btn-outline-secondary {
  background: transparent;
  border-color: var(--green-2);
  color: var(--green);
}
.btn-outline-primary:hover,
.btn-outline-secondary:hover {
  background: var(--green);
  border-color: var(--green);
  color: var(--bg);
}
.btn-secondary, .btn-light {
  background: transparent;
  border-color: var(--line-2);
  color: var(--fg);
}
.btn-secondary:hover, .btn-light:hover {
  background: var(--bg-3);
  border-color: var(--dim);
  color: var(--fg);
}
.btn-danger {
  background: var(--red);
  border-color: var(--red);
  color: var(--bg);
}
.btn-danger:hover {
  background: var(--fg);
  border-color: var(--red);
  color: var(--bg);
}
.btn-ghost-primary,
.btn-ghost-secondary {
  background: transparent;
  border-color: transparent;
  color: var(--green);
}
.btn-ghost-primary:hover,
.btn-ghost-secondary:hover {
  background: var(--green-soft);
  border-color: var(--green-2);
  color: var(--green);
}
.btn-ghost-danger {
  background: transparent;
  border-color: transparent;
  color: var(--red);
}
.btn-ghost-danger:hover {
  background: var(--red-soft);
  border-color: var(--red);
  color: var(--red);
}
.btn-ghost-success { background: transparent; border-color: transparent; color: var(--green); }
.btn-ghost-success:hover { background: var(--green-soft); border-color: var(--green-2); color: var(--green); }
.btn-ghost-warning { background: transparent; border-color: transparent; color: var(--amber); }
.btn-ghost-warning:hover { background: var(--amber-soft); border-color: var(--amber); color: var(--amber); }
.btn-ghost-light { background: transparent; border-color: transparent; color: var(--fg); }
.btn-ghost-light:hover { background: var(--bg-3); border-color: var(--line-2); color: var(--fg); }
.btn-icon { width: 32px; padding: 0; }
.btn-sm.btn-icon { width: 28px; }
.btn:focus-visible {
  outline: none;
  box-shadow: 0 0 0 1px var(--bg), 0 0 0 2px var(--green-glow);
}
.btn-close {
  filter: invert(1) hue-rotate(120deg) brightness(1.5);
  border-radius: 0;
  opacity: 0.7;
  transition: opacity var(--d) var(--ease);
}
.btn-close:hover { opacity: 1; }

/* ── 모달 ── */
.modal-backdrop { background: rgba(0,0,0,0.85); }
.modal-backdrop.show { opacity: 1; backdrop-filter: none; -webkit-backdrop-filter: none; }
.modal-content {
  background: var(--bg-1);
  border: 1px solid var(--green-2);
  border-radius: 0;
  box-shadow:
    0 0 0 1px rgba(0,255,102,0.05),
    0 24px 48px rgba(0,0,0,0.8);
  color: var(--fg);
}
.modal-header {
  border-bottom: 1px solid var(--line);
  padding: 12px 18px;
  background: rgba(0,0,0,0.5);
  border-radius: 0;
}
.modal-title {
  font-family: var(--mono);
  font-size: 12px;
  font-weight: 700;
  letter-spacing: 0.05em;
  text-transform: uppercase;
  color: var(--green);
  margin: 0;
  display: flex;
  align-items: center;
  gap: 8px;
}
.modal-body { padding: 16px 18px; background: transparent; }
.modal-footer {
  border-top: 1px solid var(--line);
  padding: 12px 18px;
  background: transparent;
  gap: 8px;
  border-radius: 0;
}
.modal-status { border-radius: 0; }
.modal-xl, .modal-lg { max-width: min(1280px, calc(100vw - 32px)); }
.modal.fade .modal-dialog {
  transform: translate3d(0,-8px,0);
  transition: transform 150ms linear, opacity 150ms linear;
}
.modal.show .modal-dialog { transform: none; }

/* ── JSON 매트릭스 모달 (핵심 영역) ── */
#json-editor-modal .modal-dialog { max-width: min(1280px, calc(100vw - 32px)); }
#json-editor-rows {
  max-height: calc(100vh - 240px);
  overflow: auto;
  background: var(--bg);
  border: 1px solid var(--line);
  border-radius: 0;
}
#json-editor-rows table { table-layout: fixed; margin: 0; background: transparent; }
#json-editor-rows th {
  font-family: var(--mono);
  font-size: 10px;
  font-weight: 700;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color: var(--amber);
  background: rgba(0,0,0,0.6);
  border-bottom: 1px solid var(--line);
  padding: 8px 10px;
  position: sticky;
  top: 0;
  z-index: 1;
}
#json-editor-rows td {
  padding: 6px 8px;
  border-bottom: 1px solid var(--line);
  vertical-align: middle;
  background: transparent;
  font-family: var(--mono);
  font-size: 11px;
}
#json-editor-rows tr:last-child td { border-bottom: none; }
#json-editor-rows tr:hover { background: rgba(0,255,102,0.03); }
#json-editor-rows input[type="text"],
#json-editor-rows input[type="number"] {
  min-width: 60px;
  background: transparent;
  border: 1px solid transparent;
  font-family: var(--mono);
  font-size: 11px;
  padding: 4px 8px;
  height: 24px;
  border-radius: 0;
  color: var(--fg);
  transition: background var(--d-fast) var(--ease), border-color var(--d-fast) var(--ease), box-shadow var(--d-fast) var(--ease);
}
#json-editor-rows input:hover { background: var(--bg-2); }
#json-editor-rows input:focus {
  background: var(--bg-1);
  border-color: var(--green);
  box-shadow: 0 0 0 1px var(--green-glow);
  outline: none;
  color: var(--green);
}
#json-editor-rows select {
  background: transparent;
  border: 1px solid var(--line);
  font-family: var(--mono);
  font-size: 11px;
  padding: 4px 8px;
  height: 24px;
  border-radius: 0;
  color: var(--fg);
}
#json-editor-rows select:focus {
  background: var(--bg-1);
  border-color: var(--green);
  box-shadow: 0 0 0 1px var(--green-glow);
  outline: none;
}
#json-editor-breadcrumb {
  font-family: var(--mono);
  font-size: 11px;
  font-weight: 500;
  color: var(--green);
  letter-spacing: 0.02em;
}
#json-editor-back {
  background: transparent;
  border: 1px solid var(--green-2);
  color: var(--green);
  font-family: var(--mono);
  font-size: 10px;
  font-weight: 700;
  padding: 4px 10px;
  height: 26px;
  letter-spacing: 0.06em;
  text-transform: uppercase;
  border-radius: 0;
  transition: all var(--d) var(--ease);
}
#json-editor-back:hover {
  background: var(--green);
  color: var(--bg);
  border-color: var(--green);
}
#json-editor-back::before { content: '['; opacity: 0.6; margin-right: 2px; }
#json-editor-back::after { content: ']'; opacity: 0.6; margin-left: 2px; }

/* ── 배지 ── */
.badge {
  font-family: var(--mono);
  font-size: 10px;
  font-weight: 700;
  letter-spacing: 0.06em;
  padding: 3px 8px;
  border-radius: 0;
  border: 1px solid transparent;
  text-transform: uppercase;
  transition: all var(--d-fast) var(--ease);
}
/* [Polymorphic] 편집기 — 타입 하나 고르고 그 타입 필드만 채우는 세로 표 */
.poly-type {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 10px 12px;
  border-bottom: 1px solid var(--border);
}
.poly-type label {
  flex: 0 0 40px;
  font-size: 12px;
  color: var(--muted);
  margin: 0;
}
.poly-fields {
  margin: 0;
}
.poly-fields th,
.poly-fields td {
  padding: 3px 12px;          /* 행이 높으면 필드 대여섯 개에도 스크롤이 생긴다 */
  vertical-align: middle;
  border-top: none;
}
.poly-fields th {
  width: 42%;
  font-weight: 400;
  font-size: 12px;
  color: var(--muted);
}
.poly-empty, .poly-unknown {
  font-size: 12px;
  color: var(--muted);
  padding: 10px 12px;
}
.poly-unknown {
  color: #f5b041;
}

.badge.bg-cyan-lt, .badge.bg-blue-lt, .json-badge {
  background: var(--green-soft) !important;
  color: var(--green) !important;
  border-color: var(--green-2);
  cursor: pointer;
  display: inline-flex;
  align-items: center;
  gap: 4px;
  max-width: 220px;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.badge.bg-cyan-lt:hover, .badge.bg-blue-lt:hover, .json-badge:hover {
  background: var(--green) !important;
  color: var(--bg) !important;
  border-color: var(--green);
}
.badge.bg-green { background: var(--green) !important; color: var(--bg) !important; border-color: var(--green); }
.badge.bg-red, .badge.bg-danger { background: var(--red) !important; color: var(--bg) !important; border-color: var(--red); }
.badge.bg-yellow, .badge.bg-orange { background: var(--amber) !important; color: var(--bg) !important; border-color: var(--amber); }
.badge.bg-purple, .badge.bg-pink, .badge.bg-teal, .badge.bg-cyan, .badge.bg-blue {
  background: var(--green-soft) !important; color: var(--green) !important; border-color: var(--green-2);
}
.badge.bg-secondary { background: transparent !important; color: var(--dim) !important; border-color: var(--line-2); }
.stat-badge {
  font-family: var(--mono);
  font-size: 10px;
  padding: 3px 8px;
  border-radius: 0;
  font-weight: 700;
}

/* ── 토스트 ── */
.toast-container {
  position: fixed;
  bottom: 20px;
  right: 20px;
  z-index: 9999;
  display: flex;
  flex-direction: column-reverse;
  gap: 8px;
}
.toast-item {
  padding: 10px 14px;
  border-radius: 0;
  color: var(--fg);
  font-family: var(--mono);
  font-size: 11px;
  background: var(--bg-2);
  border: 1px solid var(--line);
  box-shadow: 0 8px 24px rgba(0,0,0,0.7);
  display: flex;
  align-items: center;
  gap: 8px;
  animation: toastIn 0.2s linear, toastOut 0.2s linear 2.5s forwards;
}
.toast-item.success { border-left: 3px solid var(--green); color: var(--green); }
.toast-item.error { border-left: 3px solid var(--red); color: var(--red); }
.toast-item.info { border-left: 3px solid var(--amber); color: var(--amber); }
@keyframes toastIn  { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
@keyframes toastOut { to   { opacity: 0; transform: translateY(-4px); } }

/* ── Empty / Loading ── */
.empty-state {
  padding: 4rem 2rem; text-align: center;
  color: var(--dim);
  font-family: var(--mono);
}
.empty-state i { font-size: 2.5rem; margin-bottom: 1rem; opacity: 0.4; color: var(--very-dim); }
.empty-state h3 {
  font-family: var(--mono); font-size: 13px;
  color: var(--amber); letter-spacing: 0.05em;
  text-transform: uppercase; margin: 0 0 8px;
}
.empty-state p { font-size: 11px; color: var(--dim); }
.loading-spinner { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; padding: 3rem; }
.spinner-border { border-color: var(--line); border-top-color: var(--green); border-radius: 50%; }

/* 원호 스피너.
   border 는 네 변이 따로 칠해져 그라데이션이 안 된다 — conic-gradient 를 깔고
   mask 로 가운데를 뚫어 링을 만든다. 끝으로 갈수록 밝아져서 회전 방향이 읽힌다. */
.sr-spinner {
  --sr-size: 32px;
  --sr-thick: 3px;
  display: inline-block;
  flex: none;
  width: var(--sr-size);
  height: var(--sr-size);
  border-radius: 50%;
  background: conic-gradient(from 0deg,
    rgba(0,255,102,0)    0deg,
    rgba(0,255,102,0.10) 100deg,
    var(--green-2)       280deg,
    var(--green)         335deg,
    #ddffe6              357deg,
    rgba(0,255,102,0)    360deg);
  -webkit-mask: radial-gradient(farthest-side, transparent calc(100% - var(--sr-thick)), #000 calc(100% - var(--sr-thick)));
          mask: radial-gradient(farthest-side, transparent calc(100% - var(--sr-thick)), #000 calc(100% - var(--sr-thick)));
  filter: drop-shadow(0 0 4px var(--green-glow));
  animation: srSpin 0.85s linear infinite;
}
@keyframes srSpin { to { transform: rotate(360deg); } }

/* 로딩 문구 — 스피너만 있으면 무엇을 기다리는지 알 수 없다. */
.sr-label {
  font-family: var(--mono);
  font-size: 11px;
  letter-spacing: 0.08em;
  color: var(--dim);
  animation: spinnerPulse 1.4s ease-in-out infinite;
}

/* 아직 그릴 화면 자체가 없을 때(첫 진입) 덮는 로더. */
.sr-fullscreen {
  position: fixed;
  inset: 0;
  z-index: 2000;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 14px;
  background:
    radial-gradient(ellipse at 50% 50%, rgba(0,255,102,0.05), transparent 65%),
    var(--bg);
}

/* 사이드바 트리 자리 로딩 — 폭이 좁아 가로로 눕힌다. */
.tree-loading {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 10px 6px;
  font-family: var(--mono);
  font-size: 11px;
  color: var(--dim);
}

/* 버튼 안에 들어가는 스피너 — 라벨과 같은 줄에 세로 중앙으로 놓는다. */
.btn-terminal .sr-spinner,
.oauth-btn .sr-spinner { vertical-align: -2px; margin-right: 6px; }

/* 처리 중 버튼. pointer-events 를 끊어 hover 색 반전까지 함께 멈춘다. */
.btn-terminal:disabled,
.oauth-btn:disabled { opacity: 0.5; pointer-events: none; }

/* ── 환경 현황판 ─────────────────────────────────────
   카드 하나 = 환경 하나. 왼쪽은 신원(무엇인가), 오른쪽은 지표(지금 어떤가). */
.env-list { display: flex; flex-direction: column; gap: 14px; padding: 16px; }

.env-card {
  display: grid;
  grid-template-columns: minmax(220px, 300px) 1fr;
  border: 1px solid var(--line);
  background: var(--bg-1);
}
/* 좁은 화면에서는 위아래로 쌓는다 — 지표가 잘리면 볼 이유가 없다 */
@media (max-width: 720px) {
  .env-card { grid-template-columns: 1fr; }
  .env-card-side { border-right: none !important; border-bottom: 1px solid var(--line); }
}

.env-card-side { padding: 16px; border-right: 1px solid var(--line); }
.env-card-main { padding: 16px; display: flex; flex-direction: column; gap: 12px; }

.env-card-title { display: flex; align-items: center; gap: 8px; }
.env-name { font-family: var(--mono); font-size: 16px; font-weight: 700; color: var(--fg); }

.env-dot { width: 9px; height: 9px; border-radius: 50%; flex: none; }
.env-dot.ok     { background: var(--green); box-shadow: 0 0 6px var(--green-glow); }
.env-dot.paused { background: var(--dim); }
.env-dot.down   { background: var(--red); box-shadow: 0 0 6px rgba(255,51,68,0.4); }

.env-badges { display: flex; flex-wrap: wrap; gap: 6px; margin: 10px 0 14px; }
.env-badge {
  font-family: var(--mono); font-size: 10px; letter-spacing: 0.04em;
  padding: 2px 8px; border: 1px solid currentColor; border-radius: 0;
}
.env-badge.ok     { color: var(--green); }
.env-badge.paused { color: var(--dim); }
.env-badge.down   { color: var(--red); }
/* 어느 환경이 에디터·빌드 대상인지가 사고를 막는 정보다 — 눈에 띄게 둔다 */
.env-badge.editor { color: var(--amber); }
.env-badge.build  { color: var(--green-2); }
/* 지금 보고 있는 어드민이 붙은 곳 — 다른 환경과 헷갈리지 않게 채워서 표시한다 */
.env-badge.here   { color: var(--bg); background: var(--green); border-color: var(--green); }

.env-meta {
  display: grid; grid-template-columns: 56px 1fr;
  gap: 4px 10px; margin: 0;
  font-family: var(--mono); font-size: 11px;
}
.env-meta dt { color: var(--dim); font-weight: 400; }
.env-meta dd { margin: 0; color: var(--fg); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.env-domain a { color: var(--green-2); text-decoration: none; }
.env-domain a:hover { color: var(--green); text-decoration: underline; }

.env-metrics { display: grid; grid-template-columns: repeat(auto-fit, minmax(110px, 1fr)); gap: 16px; }
.env-metric-label { font-family: var(--mono); font-size: 11px; color: var(--dim); }
.env-metric-value { font-family: var(--mono); font-size: 22px; font-weight: 700; margin-top: 2px; }
.env-metric-value.ok     { color: var(--fg); }
.env-metric-value.warn   { color: var(--amber); }
.env-metric-value.danger { color: var(--red); }
.env-metric-value.none   { color: var(--very-dim); }
.env-metric-sub { font-family: var(--mono); font-size: 10px; color: var(--very-dim); margin-top: 2px; }

.env-services { display: flex; flex-wrap: wrap; gap: 12px; font-family: var(--mono); font-size: 11px; }
.env-service.ok   { color: var(--green-2); }
.env-service.down { color: var(--red); }

.env-error {
  font-family: var(--mono); font-size: 11px; color: var(--red);
  border-left: 2px solid var(--red); padding-left: 8px;
}

.env-collected {
  margin-top: auto; font-family: var(--mono); font-size: 10px; color: var(--very-dim);
}

/* 기동 중 — 정지에서 깨어나는 몇 분 동안 */
.env-badge.starting { color: var(--amber); }

.env-actions { display: flex; align-items: center; gap: 10px; }
.env-actions-hint { font-family: var(--mono); font-size: 10px; color: var(--very-dim); }

/* 환경 선택 화면 머리말 */
.env-intro {
  padding: 4px 2px 8px;
  display: flex; align-items: flex-start; justify-content: space-between; gap: 12px;
}
.env-heading { font-family: var(--mono); font-size: 18px; color: var(--fg); margin: 0; }
.env-subheading { font-family: var(--mono); font-size: 11px; color: var(--dim); margin: 4px 0 0; }

/* 카드 전체가 진입점이다 — 되돌릴 수 없는 조작은 설정에만 둔다 */
.env-card.clickable { cursor: pointer; transition: border-color var(--d) var(--ease); }
.env-card.clickable:hover { border-color: var(--green-2); }
.env-card.clickable:focus-visible { outline: 1px solid var(--green); outline-offset: 2px; }
.env-enter-hint {
  font-family: var(--mono); font-size: 11px; color: var(--green-2);
}

/* 환경 안에 있을 때 사이드바 맨 위 — 어디에 들어와 있는지 항상 보인다 */
.sidebar-envchip {
  display: block; margin: 0 0 10px;
  padding: 6px 10px; border: 1px solid var(--green-2);
  font-family: var(--mono); font-size: 11px; color: var(--green);

}

/* 로그인 없이 열려 있는 구간 — 지나치기 어려워야 한다. 닫기 버튼을 두지 않는 이유다. */
.unlocked-banner {
  display: flex; align-items: flex-start; gap: 10px;

/* ── 앱 설정 ── */
.appset { display: flex; flex-direction: column; gap: 20px; padding: 16px; }
.appset-block { border: 1px solid var(--line); background: var(--bg-1); padding: 16px; }

.appset-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; }
.appset-title { font-family: var(--mono); font-size: 13px; color: var(--fg); margin: 0 0 4px; }

/* 설정 한 줄 — 왼쪽은 무엇인가, 오른쪽은 입력. FarmStack 배치를 따랐다. */

  /* wrap — 펼친 입력 영역(.appset-edit)이 줄 아래로 내려가야 한다 */

.appset-edit { flex-basis: 100%; padding: 12px 0 4px; }

  font-family: var(--mono); font-size: 11px; color: var(--dim);
}

/* ⚡ 문구 — 이 값이 실제로 무엇을 켜는지. 설정 화면에서 가장 값어치 있는 정보다 */
.appset-note {
  margin-top: 12px; padding: 10px 12px;
  border-left: 2px solid var(--amber); background: var(--amber-soft);
  font-family: var(--mono); font-size: 11px; color: var(--fg); line-height: 1.8;
}
.appset-actions { display: flex; align-items: center; gap: 12px; margin-top: 14px; }
.appset-dirty { font-family: var(--mono); font-size: 11px; color: var(--amber); }

/* ── 대시보드 ── */
.dash { display: flex; flex-direction: column; gap: 16px; padding: 16px; }

/* 쓰기가 열린 테이블 — 들어오자마자 보여야 하는 유일한 경고다 */
.dash-alert {
  display: flex; gap: 6px; padding: 12px 14px;
  border: 1px solid var(--red); background: var(--red-soft);
  font-family: var(--mono); font-size: 12px; color: var(--red);
}
.dash-alert-sub { font-size: 11px; color: var(--fg); margin-top: 6px; line-height: 1.7; }

.dash-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 12px; }
.dash-tile { border: 1px solid var(--line); background: var(--bg-1); padding: 14px 16px; }
.dash-tile.clickable { cursor: pointer; transition: border-color var(--d) var(--ease); }
.dash-tile.clickable:hover { border-color: var(--green-2); }
.dash-tile.danger { border-color: var(--red); }
.dash-tile-label { font-family: var(--mono); font-size: 11px; color: var(--dim); }
.dash-tile-value { font-family: var(--mono); font-size: 24px; font-weight: 700; color: var(--fg); margin-top: 2px; }
.dash-tile.danger .dash-tile-value { color: var(--red); }
.dash-tile-sub { font-family: var(--mono); font-size: 10px; color: var(--very-dim); margin-top: 2px; }

.dash-block { border: 1px solid var(--line); background: var(--bg-1); }
.dash-block-head {
  display: flex; align-items: center; justify-content: space-between;

}
.dash-block-title { font-family: var(--mono); font-size: 12px; color: var(--fg); margin: 0; }

/* 접을 수 있는 그룹 머리 */
.tree-section.toggle {

}
.tree-section.toggle:hover { color: var(--green); }
.tree-section .caret { font-size: 9px; width: 10px; }
.tree-count { margin-left: auto; color: var(--very-dim); font-size: 10px; }

/* 환경에 안 붙은 프로젝트 — 지표 대신 다음 할 일을 적는다 */
.env-unlinked {
  font-family: var(--mono); font-size: 11px; color: var(--dim); line-height: 1.7;
}

/* ── 로그인 페이지 (Terminal Window) ── */
#login-page {

}

.terminal-input {

  margin-bottom: 12px;
}
.action-line {
  display: flex; gap: 8px; margin-top: 18px;
}
.btn-terminal {

  font-size: 12px;
  font-weight: 700;
  padding: 8px 14px;

}
.btn-terminal:hover { background: var(--green); color: var(--bg); }
.oauth-divider {

}
.oauth-list { display: grid; gap: 6px; }
.status-bar {
  margin-top: 24px; padding-top: 12px;
  border-top: 1px dashed var(--line);
  font-family: var(--mono);
  font-size: 10px; color: var(--dim);
  text-align: center;
  letter-spacing: 0.06em;
}

/* ── 페이지 진입/전환 ── */
#admin-page { display: none !important; }
#admin-page.active { display: flex !important; animation: pageEnter 0.3s linear; }
@keyframes pageEnter {
  from { opacity: 0; }
  to   { opacity: 1; }
}
.page-fade { animation: pageFade 0.2s linear; }
@keyframes pageFade {
  from { opacity: 0; }
  to   { opacity: 1; }
}
.page-transition { animation: pageTransition 0.2s linear; }
@keyframes pageTransition {
  from { opacity: 0; }
  to   { opacity: 1; }
}

/* ── 접근 정책 배지 (ADR-0004) ── */
.policy-box { padding: 8px 12px; border-bottom: 1px solid var(--line); display: flex; flex-wrap: wrap; align-items: center; gap: 10px; }
.policy-badge {
  background: transparent; border: 1px solid var(--line); color: var(--dim);
  font-family: var(--mono); font-size: 11px; padding: 3px 10px; cursor: pointer;
}
.policy-badge:hover { border-color: var(--green-2); color: var(--fg); }
.policy-badge.danger { border-color: var(--red); color: var(--red); background: var(--red-soft); }
.policy-panel { display: flex; gap: 16px; flex-wrap: wrap; }
.policy-opt { display: flex; align-items: center; gap: 5px; cursor: pointer; font-family: var(--mono); font-size: 11px; color: var(--fg); }

.policy-note { color: var(--very-dim); font-size: 10px; }

/* ── 알림(alert) ── */
.alert {
  /* Tabler 1.x 의 .alert 는 display:flex 라 자식 블록이 가로로 늘어선다.
     여기서는 아이콘 레이아웃을 쓰지 않으므로 block 으로 되돌린다. */
  display: block;

}

  border-left: 3px solid var(--red);
  background: var(--red-soft);
  border-color: rgba(255,51,68,0.3);

}

  border-left: 3px solid var(--green);

}

  font-size: 12px;

  color: var(--green);
  border-color: var(--line) var(--line) transparent;

  bottom: -1px; left: 0; right: 0;

}

}

}

.tooltip-inner {
  background: var(--bg-1);
  color: var(--green);
  border: 1px solid var(--green-2);
  font-family: var(--mono);
  font-size: 11px;
  padding: 6px 10px;
  border-radius: 0;
}
.tooltip .tooltip-arrow::before { border-top-color: var(--green-2) !important; }

/* ── 기본 input/button radius 강제 (놓친 곳 안전망) ── */
input, select, textarea, button { border-radius: 0 !important; }
.btn-list { gap: 4px; }

/* ── 코드 ── */

}

  try { providers = JSON.parse('{{AUTH_PROVIDERS_JSON}}'); } catch (e) { providers = []; }
  var ref = '';
  try { ref = new URL(url).hostname.split('.')[0]; } catch (e) { ref = ''; }
  return { supabaseUrl: url, supabaseAnonKey: anonKey, authProviders: providers, projectRef: ref };
})();

// 부팅 실패 방어 — React 가 뜨기만 하면 이후 에러는 React 쪽에서 다룬다.
function __suparunBootError(msg) {
  var box = document.getElementById('boot-error');
  var el = document.getElementById('boot-error-msg');
  if (!box || !el) return;
  box.style.display = '';
  el.textContent = msg;
}
window.onerror = function (msg, src, line) {
  __suparunBootError(msg + ' (' + (src || '') + ':' + (line || '') + ')');
  console.error('Admin Error:', msg, src, line);
};
window.addEventListener('unhandledrejection', function (e) {
  __suparunBootError((e.reason && e.reason.message) || String(e.reason));
  console.error('Unhandled rejection:', e.reason);
});
